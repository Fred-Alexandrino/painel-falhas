name: logs-vm1-fv
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_VM1_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 168.138.232.237 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Fetch logs
        run: |
          mkdir -p backups
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ubuntu@168.138.232.237 \
            "sudo journalctl -u painel-falhas --since '2026-08-16 07:55:00' --until '2026-08-16 08:20:00' --no-pager | grep -i -E 'fv|FV Energias'" \
            > backups/logs-vm1-fv.txt 2>&1 || echo "sem linhas encontradas ou erro no comando" >> backups/logs-vm1-fv.txt
          cat backups/logs-vm1-fv.txt
      - name: Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Fred-Alexandrino/painel-falhas.git
          git pull --rebase origin main
          git add backups/logs-vm1-fv.txt
          git commit -m "chore: logs vm1 fv 8h" || echo "nothing"
          git push origin HEAD:main
