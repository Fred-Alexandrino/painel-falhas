name: Diag Zeladoria Atualizar Lote
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          curl -s -w "\nSTATUS:%{http_code}\n" --max-time 30 -X POST \
            -H "X-Webhook-Secret: falhas2026" \
            -H "Content-Type: application/json" \
            --data @backups/zeladoria-payload.json \
            "https://api.168.138.232.237.sslip.io/zeladoria-atualizar-lote" \
            -o backups/diag-atualizar-lote.txt
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-atualizar-lote.txt
          git commit -m "diag atualizar lote zeladoria [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-atualizar-lote.txt
          git commit -m "diag atualizar lote zeladoria [skip ci]" || echo "nothing2"
          git push origin HEAD:main
