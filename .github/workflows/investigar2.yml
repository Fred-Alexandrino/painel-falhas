name: Investigar Resumo Dois
on:
  workflow_dispatch: {}
jobs:
  t:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          WEBHOOK_SECRET: ${{ secrets.FALHAS_WEBHOOK_SECRET }}
        run: |
          echo "=== overrides de desligamento manual ===" > resultado.txt
          curl -s -m 20 "https://api.168.138.232.237.sslip.io/desligamento-manual" -o /tmp/overrides.json
          cat /tmp/overrides.json | python3 -c "
import json,sys
d = json.load(sys.stdin)
for it in d.get('itens',[]):
    print(it)
" >> resultado.txt
          cat resultado.txt
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          mkdir -p backups
          cp resultado.txt backups/investigar-resumo2.txt
          git add backups/investigar-resumo2.txt
          git commit -m "investigar resumo2 [skip ci]"
          n=0
          until git push || [ $n -ge 8 ]; do
            n=$((n+1))
            sleep 3
            git pull --rebase origin main
          done
