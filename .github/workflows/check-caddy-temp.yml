name: Checar Config Caddy v3 (temporario)
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Coletar diagnostico e commitar via API do GitHub
        uses: appleboy/ssh-action@v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: 168.138.232.237
          username: ubuntu
          key: ${{ secrets.ORACLE_VM1_SSH_KEY }}
          envs: GH_TOKEN
          script: |
            {
              echo "=== Caddyfile (locais encontrados) ==="
              sudo find / -iname "Caddyfile*" 2>/dev/null
              for f in $(sudo find / -iname "Caddyfile*" 2>/dev/null); do
                echo "--- $f ---"
                sudo cat "$f"
              done
              echo ""
              echo "=== gunicorn ExecStart (systemd) ==="
              sudo grep -n "ExecStart" /etc/systemd/system/painel-falhas.service
              echo ""
              echo "=== processo gunicorn rodando (linha de comando real) ==="
              ps aux | grep gunicorn | grep -v grep
              echo ""
              echo "=== memoria ==="
              free -h
              echo ""
              echo "=== ultimas 150 linhas do log do servico ==="
              sudo journalctl -u painel-falhas -n 150 --no-pager
            } > /tmp/diag_caddy.txt 2>&1

            python3 << 'PYEOF'
import base64, json, os, urllib.request

token = os.environ["GH_TOKEN"]
url = "https://api.github.com/repos/Fred-Alexandrino/painel-falhas/contents/backups/diag-caddy-result.txt"
headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github+json"}

sha = None
req = urllib.request.Request(url, headers=headers)
try:
    with urllib.request.urlopen(req) as resp:
        sha = json.loads(resp.read())["sha"]
except Exception:
    pass

with open("/tmp/diag_caddy.txt", "rb") as f:
    conteudo = base64.b64encode(f.read()).decode()

payload = {"message": "Diagnostico caddy/gunicorn/logs", "content": conteudo}
if sha:
    payload["sha"] = sha

req2 = urllib.request.Request(url, data=json.dumps(payload).encode(), headers={**headers, "Content-Type": "application/json"}, method="PUT")
with urllib.request.urlopen(req2) as resp:
    print(resp.status, resp.read()[:200])
PYEOF
