name: Fix GH Token VM2 Temp
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: SSH replace token in .env
        env:
          SSH_KEY: ${{ secrets.ORACLE_VM2_SSH_KEY }}
          NEW_TOKEN: ${{ secrets.TEMP_WPP_BACKUP_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/vm2_key
          chmod 600 ~/.ssh/vm2_key
          mkdir -p backups
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vm2_key ubuntu@147.15.66.241 "
            cd ~/wppconnect-server
            cp .env .env.bak_$(date +%Y%m%d_%H%M%S)
            sed -i 's|^GITHUB_TOKEN=.*|GITHUB_TOKEN=$NEW_TOKEN|' .env
            echo '=== confirmando (mascarado) ==='
            grep GITHUB_TOKEN .env | cut -c1-14
            echo '=== testando novo token direto ==='
            set -a; source .env; set +a
            curl -s -w '\nSTATUS:%{http_code}\n' -H \"Authorization: token \$GITHUB_TOKEN\" https://api.github.com/repos/Fred-Alexandrino/wppconnect-auth-backup | head -5
            echo '=== reiniciando servico ==='
            sudo systemctl restart wppconnect
            sleep 8
            sudo systemctl status wppconnect --no-pager | head -8
          " > backups/diag-fixtoken.txt 2>&1
          cat backups/diag-fixtoken.txt
      - if: always()
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git add backups/diag-fixtoken.txt
          git commit -m "diag fixtoken [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-fixtoken.txt
          git commit -m "diag fixtoken [skip ci]" || echo "nothing2"
          git push origin HEAD:main
