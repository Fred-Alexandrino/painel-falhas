name: Fetch Fracttal Checklist Try Temp
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          WEBHOOK_SECRET: ${{ secrets.FALHAS_WEBHOOK_SECRET }}
        run: |
          mkdir -p backups
          echo "--- tasks/16575322 ---" > backups/diag-checklist-try.txt
          curl -s --max-time 20 -H "X-Webhook-Secret: $WEBHOOK_SECRET" "https://api.168.138.232.237.sslip.io/fracttal-raw?endpoint=tasks/16575322" >> backups/diag-checklist-try.txt
          echo "" >> backups/diag-checklist-try.txt
          echo "--- work_orders_tasks/55944492 ---" >> backups/diag-checklist-try.txt
          curl -s --max-time 20 -H "X-Webhook-Secret: $WEBHOOK_SECRET" "https://api.168.138.232.237.sslip.io/fracttal-raw?endpoint=work_orders_tasks/55944492" >> backups/diag-checklist-try.txt
          echo "" >> backups/diag-checklist-try.txt
          echo "--- work_orders_tasks/55944492/checklist ---" >> backups/diag-checklist-try.txt
          curl -s --max-time 20 -H "X-Webhook-Secret: $WEBHOOK_SECRET" "https://api.168.138.232.237.sslip.io/fracttal-raw?endpoint=work_orders_tasks/55944492/checklist" >> backups/diag-checklist-try.txt
          echo "" >> backups/diag-checklist-try.txt
          echo "--- tasks/16575322/instructions ---" >> backups/diag-checklist-try.txt
          curl -s --max-time 20 -H "X-Webhook-Secret: $WEBHOOK_SECRET" "https://api.168.138.232.237.sslip.io/fracttal-raw?endpoint=tasks/16575322/instructions" >> backups/diag-checklist-try.txt
      - if: always()
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git add backups/diag-checklist-try.txt
          git commit -m "diag checklist try" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-checklist-try.txt
          git commit -m "diag checklist try" || echo "nothing2"
          git push origin HEAD:main
