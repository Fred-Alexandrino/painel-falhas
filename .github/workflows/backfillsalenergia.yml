name: Backfill Sal Energia
on:
  workflow_dispatch: {}
jobs:
  t:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          WEBHOOK_SECRET: ${{ secrets.FALHAS_WEBHOOK_SECRET }}
        run: |
          R=$(curl -s -m 50 -X POST "https://api.168.138.232.237.sslip.io/backfill-fracttal?start=0&limit=100" -H "X-Webhook-Secret: $WEBHOOK_SECRET")
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          M=$(echo "$R" | head -c 900)
          git commit --allow-empty -m "BACKFILLSAL=[$M]"
          n=0
          until git push || [ $n -ge 6 ]; do
            n=$((n+1))
            sleep 3
            git pull --rebase origin main
          done
