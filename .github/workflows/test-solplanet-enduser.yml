name: test-solplanet-enduser

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode and run End User signature test
        run: |
          echo "" | base64 -d > sign_test2.py
          mkdir -p backups
          python3 sign_test2.py > backups/solplanet-enduser-result.txt 2>&1 || true
          cat backups/solplanet-enduser-result.txt

      - name: Commit and push results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Fred-Alexandrino/painel-falhas.git
          git add backups/solplanet-enduser-result.txt
          git commit -m "test: solplanet end-user api result" || echo "nothing to commit"
          git push origin HEAD:main
