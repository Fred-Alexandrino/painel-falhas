name: Diagnostico Resumo Hoje (temp)
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Checar resumos, sync-fracttal e UptimeRobot
        run: |
          mkdir -p backups
          {
            echo "=== /resumos?tipo=diario&limit=3 ==="
            curl -s --max-time 20 "https://api.168.138.232.237.sslip.io/resumos?tipo=diario&limit=3"
            echo ""
            echo "=== /sync-fracttal (chamada agora, ve resumo_diario_check) ==="
            curl -s --max-time 60 -X POST "https://api.168.138.232.237.sslip.io/sync-fracttal"
            echo ""
            echo "=== UptimeRobot: monitores e logs ==="
            curl -s -X POST "https://api.uptimerobot.com/v2/getMonitors"               --data-urlencode "api_key=u3601581-1a0e78f355310dcaebe3ceaf"               --data-urlencode "format=json"               --data-urlencode "logs=1"               --data-urlencode "logs_limit=40"
          } > backups/diag-resumo-hoje.txt 2>&1
      - name: Commitar resultado
        run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-resumo-hoje.txt
          git commit -m "diag resumo hoje [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-resumo-hoje.txt
          git commit -m "diag resumo hoje [skip ci]" || echo "nothing2"
          git push origin HEAD:main
