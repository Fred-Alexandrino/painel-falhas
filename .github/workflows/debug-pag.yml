name: debug-paginacao

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debug
        run: |
          echo "" | base64 -d > debug_paginacao.py
          mkdir -p backups
          python3 debug_paginacao.py > backups/debug-pag-result.txt 2>&1 || true
          cat backups/debug-pag-result.txt
      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Fred-Alexandrino/painel-falhas.git
          git add backups/debug-pag-result.txt
          git commit -m "debug: paginacao" || echo "nothing"
          git push origin HEAD:main
