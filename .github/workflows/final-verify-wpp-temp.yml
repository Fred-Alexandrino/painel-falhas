name: Final Verify WPP Temp
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          echo "--- VM2 health ---" > backups/diag-final.txt
          curl -s -w "\nSTATUS:%{http_code} TIME:%{time_total}\n" --max-time 15 "https://wpp.147.15.66.241.sslip.io/health" >> backups/diag-final.txt
          echo "--- VM1 health ---" >> backups/diag-final.txt
          curl -s -w "\nSTATUS:%{http_code}\n" --max-time 15 "https://api.168.138.232.237.sslip.io/health" >> backups/diag-final.txt
      - if: always()
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git add backups/diag-final.txt
          git commit -m "diag final [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-final.txt
          git commit -m "diag final [skip ci]" || echo "nothing2"
          git push origin HEAD:main
