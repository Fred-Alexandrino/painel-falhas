name: test-fv-alerta

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          echo "" | base64 -d > test_alerta.py
          mkdir -p backups
          python3 test_alerta.py > backups/fv-alerta-result.txt 2>&1 || true
          cat backups/fv-alerta-result.txt
      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Fred-Alexandrino/painel-falhas.git
          git add backups/fv-alerta-result.txt
          git commit -m "test: fv alerta check" || echo "nothing"
          git push origin HEAD:main
