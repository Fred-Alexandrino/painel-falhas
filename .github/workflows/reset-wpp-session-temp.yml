name: Reset WPP Session Temp
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: SSH stop service and clear local session
        env:
          SSH_KEY: ${{ secrets.ORACLE_VM2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/vm2_key
          chmod 600 ~/.ssh/vm2_key
          mkdir -p backups
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vm2_key ubuntu@147.15.66.241 '
            echo "=== stopping service ==="
            sudo systemctl stop wppconnect
            echo "=== backing up corrupted auth_info locally (safety) ==="
            cd ~/wppconnect-server
            if [ -d auth_info ]; then
              mv auth_info auth_info_corrompida_$(date +%Y%m%d_%H%M%S)
            fi
            echo "=== confirming auth_info removed ==="
            ls -la ~/wppconnect-server/ | grep auth_info || echo "sem pasta auth_info ativa - OK"
          ' > backups/diag-reset1.txt 2>&1
          cat backups/diag-reset1.txt
      - name: Commit and push
        if: always()
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git add backups/diag-reset1.txt
          git commit -m "diag reset step1 [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-reset1.txt
          git commit -m "diag reset step1 [skip ci]" || echo "nothing2"
          git push origin HEAD:main
