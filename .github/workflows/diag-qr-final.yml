name: diag-qr-final
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check QR
        run: |
          echo "" | base64 -d > check.py
          python3 check.py > result.txt 2>&1 || true
          cat result.txt
          python3 -c "
import base64, urllib.request, json, os
content = open('result.txt','rb').read()
b64 = base64.b64encode(content).decode()
token = os.environ['GH_TOKEN']
url = 'https://api.github.com/repos/Fred-Alexandrino/painel-falhas/contents/backups/qr-final.txt'
headers = {'Authorization': f'token {token}', 'Accept': 'application/vnd.github+json'}
sha = None
try:
    req_get = urllib.request.Request(url, headers=headers)
    with urllib.request.urlopen(req_get, timeout=20) as resp:
        sha = json.loads(resp.read().decode()).get('sha')
except Exception:
    pass
payload_dict = {'message': 'diag: qr final', 'content': b64}
if sha:
    payload_dict['sha'] = sha
req = urllib.request.Request(url, data=json.dumps(payload_dict).encode(), method='PUT', headers={**headers, 'Content-Type': 'application/json'})
with urllib.request.urlopen(req, timeout=30) as resp:
    print('PUT OK', resp.status)
"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
