name: check-wpp-status3-9104
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Curl status
        run: |
          curl -s "https://wpp.147.15.66.241.sslip.io/health" > result.txt
          echo "" >> result.txt
          curl -s "https://wpp.147.15.66.241.sslip.io/qr" | head -c 500 >> result.txt
      - name: Commit result
        run: |
          git config user.name "bot"
          git config user.email "bot@example.com"
          cp result.txt backups/check-wpp-status3-result.txt
          git add backups/check-wpp-status3-result.txt
          git commit -m "check wpp status3" || echo "nothing to commit"
          git push
