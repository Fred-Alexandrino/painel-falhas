name: check-ajuste-9104
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Curl endpoint
        run: |
          curl -s -X POST "https://api.168.138.232.237.sslip.io/sobreaviso-ajustar-texto" -H "Content-Type: application/json" -d '{"bloco":1,"grupo":"Demerval Lobão / Timon / Junco + União I e II","pessoas":["Luiz Félix","Antônio Campelo"]}' > result.txt
          echo "" >> result.txt
          echo "=== teste com nome invalido ===" >> result.txt
          curl -s -X POST "https://api.168.138.232.237.sslip.io/sobreaviso-ajustar-texto" -H "Content-Type: application/json" -d '{"bloco":1,"grupo":"Demerval Lobão / Timon / Junco + União I e II","pessoas":["Fulano Inventado","Antônio Campelo"]}' >> result.txt
      - name: Commit result
        run: |
          git config user.name "bot"
          git config user.email "bot@example.com"
          mkdir -p backups
          cp result.txt backups/check-ajuste-result.txt
          git add backups/check-ajuste-result.txt
          git commit -m "check ajuste" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
