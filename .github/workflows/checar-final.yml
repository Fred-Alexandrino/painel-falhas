name: Checar Final Temporario
on:
  workflow_dispatch: {}
jobs:
  checar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Checar
        run: |
          mkdir -p backups
          curl -s "https://api.168.138.232.237.sslip.io/supervisao-temporaria" -o backups/checar-final.json
          cat backups/checar-final.json
      - name: Salvar
        if: always()
        run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/checar-final.json
          git diff --quiet --cached || git commit -m "Checar final [skip ci]"
          git push
