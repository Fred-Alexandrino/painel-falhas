name: Teste Fotos 2
on:
  workflow_dispatch: {}
jobs:
  t:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "" | base64 -d > foto_teste.jpg
          CRIAR=$(curl -s -m 20 -X POST "https://api.168.138.232.237.sslip.io/nova-atividade" -H "Content-Type: application/json" -d '{"cliente":"Geral","usina":"Geral","descricao":"TESTE FOTO 2 - pode apagar","editor":"teste-automatizado"}')
          ID=$(echo "$CRIAR" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))")
          ANEXAR=$(curl -s -m 20 -X POST "https://api.168.138.232.237.sslip.io/atividade-anexar-foto" -F "id=$ID" -F "foto=@foto_teste.jpg")
          LISTAR=$(curl -s -m 20 "https://api.168.138.232.237.sslip.io/atividade-fotos/$ID")
          RESTRICAO=$(curl -s -m 20 -X POST "https://api.168.138.232.237.sslip.io/atividade-anexar-foto" -F "id=ID_FALSO_999" -F "foto=@foto_teste.jpg")
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          MSG="TESTEFOTOS2 id=$ID anexar=[$ANEXAR] listar=[$LISTAR] restricao=[$RESTRICAO]"
          git commit --allow-empty -m "$MSG"
          n=0
          until git push || [ $n -ge 8 ]; do
            n=$((n+1))
            sleep 3
            git pull --rebase origin main
          done
