name: Limpar Trava Compromissos (temp)
on:
  workflow_dispatch: {}
jobs:
  limpar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resetar trava compromissos_gerados_em pra forçar regeneração
        env:
          WEBHOOK_SECRET: ${{ secrets.FALHAS_WEBHOOK_SECRET }}
        run: |
          mkdir -p backups
          curl -s -X POST "https://api.168.138.232.237.sslip.io/config-set-lote" \
            -H "X-Webhook-Secret: $WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"pares": {"compromissos_gerados_em": "00/0000"}}' -o backups/limpar-trava-result.json
          cat backups/limpar-trava-result.json
          echo "---"
          curl -s "https://api.168.138.232.237.sslip.io/compromissos" -o backups/compromissos-apos-limpar.json
          cat backups/compromissos-apos-limpar.json
      - if: always()
        run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/limpar-trava-result.json backups/compromissos-apos-limpar.json
          git diff --quiet --cached || git commit -m "limpar trava compromissos [skip ci]"
          git push
