name: Diagnostico VM1 status ao vivo (temp)
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Checar health e status via SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_VM1_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/vm1_key
          chmod 600 ~/.ssh/vm1_key
          mkdir -p backups
          {
            echo "=== curl /health direto (tempo de resposta) ==="
            time curl -s -m 15 -w "\nHTTP:%{http_code} TIME:%{time_total}\n" "https://api.168.138.232.237.sslip.io/health"
            echo ""
            echo "=== curl /sync-fracttal com secret (tempo de resposta) ==="
            time curl -s -m 60 -w "\nHTTP:%{http_code} TIME:%{time_total}\n" -X POST "https://api.168.138.232.237.sslip.io/sync-fracttal?secret=falhas2026"
          } > backups/diag-vm1-curl.txt 2>&1
          timeout 40 ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i ~/.ssh/vm1_key ubuntu@168.138.232.237 '
            echo "=== systemctl status painel-falhas ==="
            sudo systemctl status painel-falhas --no-pager -l | head -30
            echo "=== memoria ==="
            free -h
            echo "=== processos gunicorn ==="
            ps aux | grep -i gunicorn | grep -v grep
            echo "=== journal ultimas 100 linhas ==="
            sudo journalctl -u painel-falhas --no-pager -n 100
          ' > backups/diag-vm1-ssh.txt 2>&1
      - name: Commitar resultado
        if: always()
        run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-vm1-curl.txt backups/diag-vm1-ssh.txt
          git commit -m "diag vm1 status [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-vm1-curl.txt backups/diag-vm1-ssh.txt
          git commit -m "diag vm1 status [skip ci]" || echo "nothing2"
          git push origin HEAD:main
