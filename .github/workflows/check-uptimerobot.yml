name: check-uptimerobot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check account
        run: |
          echo "" | base64 -d > check_uptimerobot.py
          mkdir -p backups
          python3 check_uptimerobot.py > backups/uptimerobot-account.txt 2>&1 || true
          cat backups/uptimerobot-account.txt
      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Fred-Alexandrino/painel-falhas.git
          git add backups/uptimerobot-account.txt
          git commit -m "test: uptimerobot account check" || echo "nothing"
          git push origin HEAD:main
