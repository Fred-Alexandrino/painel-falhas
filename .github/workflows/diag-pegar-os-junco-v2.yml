name: Diag Pegar OS Junco Completa v2
on:
  workflow_dispatch: {}
jobs:
  buscar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      WEBHOOK_SECRET: ${{ secrets.FALHAS_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Criar script
        run: |
          cat > /tmp/pega.py << 'PYEOF'
          import json, sys
          d = json.load(sys.stdin)
          data = d.get("body", {}).get("data", [])
          for item in data:
              grp = item.get("groups_1_description") or ""
              if "Junco" in grp:
                  print(json.dumps(item, ensure_ascii=False, indent=2))
                  sys.exit(0)
          sys.exit(1)
          PYEOF
      - name: Buscar em varias paginas
        run: |
          BASE="https://api.168.138.232.237.sslip.io"
          mkdir -p backups
          OUT=backups/os-junco-exemplo.txt
          echo "vazio" > $OUT
          START=0
          for i in $(seq 1 30); do
            RESP=$(curl -s "$BASE/fracttal-raw?since=2026-03-01T00:00:00-00:00&ot_status=1&start=$START&limit=100" -H "X-Webhook-Secret: $WEBHOOK_SECRET")
            if echo "$RESP" | python3 /tmp/pega.py > $OUT.tmp 2>/dev/null; then
              mv $OUT.tmp $OUT
              echo "Encontrado na pagina start=$START" >> $OUT
              break
            fi
            START=$((START + 100))
            sleep 1
          done
      - if: always()
        run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/os-junco-exemplo.txt
          git diff --quiet --cached || git commit -m "Diagnostico v2: exemplo completo OS Junco [skip ci]"
          git push
