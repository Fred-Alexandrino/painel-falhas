name: Diag Comunicado Preset
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          curl -s -w "\nSTATUS:%{http_code}\n" --max-time 20 -X POST -H "Content-Type: application/json" \
            -d '{"tema":"comunicado padrão","observacoes":""}' \
            "https://api.168.138.232.237.sslip.io/gerar-comunicado-livre-ia" -o backups/diag-preset.txt
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-preset.txt
          git commit -m "diag preset comunicado [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-preset.txt
          git commit -m "diag preset comunicado [skip ci]" || echo "nothing2"
          git push origin HEAD:main
