name: check-upload-escala-9104
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload escala
        run: |
          curl -s -X POST "https://api.168.138.232.237.sslip.io/sobreaviso-upload" -F "arquivo=@backups/escala_upload_temp.html" > result.txt
      - name: Commit result
        run: |
          git config user.name "bot"
          git config user.email "bot@example.com"
          cp result.txt backups/check-upload-escala-result.txt
          git add backups/check-upload-escala-result.txt
          git commit -m "check upload escala result" || echo "nothing to commit"
          git push
