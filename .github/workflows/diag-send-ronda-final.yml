name: diag-send-ronda-final
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Send today ronda
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "" | base64 -d > check.py
          python3 check.py > result.txt 2>&1 || true
          cat result.txt
          CONTENT_B64=$(base64 -w0 result.txt)
          PAYLOAD="{\"message\":\"diag: send final ronda\",\"content\":\"$CONTENT_B64\"}"
          echo "$PAYLOAD" > /tmp/payload.json
          curl -s -X PUT -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Fred-Alexandrino/painel-falhas/contents/backups/ronda-final-result.txt" \
            -d @/tmp/payload.json -w "\nHTTP:%{http_code}\n"
