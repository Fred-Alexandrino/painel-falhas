name: Diagnostico Sync
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          curl -s -w "\nSTATUS:%{http_code}\n" --max-time 20 "https://api.168.138.232.237.sslip.io/programacao-pcm?data=2026-07-27" -o backups/diag-pcm-27.txt
          curl -s -w "\nSTATUS:%{http_code}\n" --max-time 20 "https://api.168.138.232.237.sslip.io/programacao-pcm?data=2026-07-28" -o backups/diag-pcm-28.txt
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-pcm-27.txt backups/diag-pcm-28.txt
          git commit -m "diag sync [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-pcm-27.txt backups/diag-pcm-28.txt
          git commit -m "diag sync [skip ci]" || echo "nothing2"
          git push origin HEAD:main
