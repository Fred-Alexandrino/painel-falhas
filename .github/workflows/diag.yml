name: Diagnostico Sync
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          mkdir -p backups
          curl -s --max-time 20 "https://api.168.138.232.237.sslip.io/chamados-fabricante" -o backups/diag-verify.txt
          echo "GET_EXIT:$?" >> backups/diag-verify.txt
          echo "---POST---" >> backups/diag-verify.txt
          curl -s --max-time 20 -X POST -H "Content-Type: application/json" -d "{\"ok\": true, \"criadas\": 0, \"atualizadas\": 0}" "https://api.168.138.232.237.sslip.io/reportar-status-sincronizacao-chamados" >> backups/diag-verify.txt
          echo "POST_EXIT:$?" >> backups/diag-verify.txt
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-verify.txt
          git commit -m "diag verify [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-verify.txt
          git commit -m "diag verify [skip ci]" || echo "nothing2"
          git push origin HEAD:main
