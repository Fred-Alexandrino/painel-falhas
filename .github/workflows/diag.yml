name: Diagnostico Sync
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          curl -s --max-time 25 "https://api.168.138.232.237.sslip.io/chamados-fabricante" | python3 -c "
import sys, json
d = json.load(sys.stdin)
print('total:', d.get('total'))
print('ultimaSincronizacao:', d.get('ultimaSincronizacao'))
print('ultimaTentativa:', d.get('ultimaTentativa'))
print('ultimoStatus:', d.get('ultimoStatus'))
print('ultimoErro:', d.get('ultimoErro'))
" > backups/diag-status-check.txt
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-status-check.txt
          git commit -m "diag status check [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-status-check.txt
          git commit -m "diag status check [skip ci]" || echo "nothing2"
          git push origin HEAD:main
