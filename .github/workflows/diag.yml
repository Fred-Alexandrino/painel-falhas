name: Diagnostico Sync
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          curl -s --max-time 25 "https://api.168.138.232.237.sslip.io/chamados-fabricante" -o backups/diag-status-check-raw.txt
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-status-check-raw.txt
          git commit -m "diag status check [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-status-check-raw.txt
          git commit -m "diag status check [skip ci]" || echo "nothing2"
          git push origin HEAD:main
