name: Diagnostico Sync
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          WEBHOOK_SECRET: ${{ secrets.FALHAS_WEBHOOK_SECRET }}
        run: |
          mkdir -p backups
          curl -s -m 20 "https://api.168.138.232.237.sslip.io/desligamento-manual" -o backups/diag-overrides.json
          cat backups/diag-overrides.json
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-overrides.json
          git commit -m "diag overrides [skip ci]" || echo "nothing"
          n=0
          until git push || [ $n -ge 8 ]; do
            n=$((n+1))
            sleep 3
            git pull --rebase origin main
          done
