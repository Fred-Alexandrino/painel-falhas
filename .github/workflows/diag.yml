name: Diagnostico Sync
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          WEBHOOK_SECRET: ${{ secrets.FALHAS_WEBHOOK_SECRET }}
        run: |
          mkdir -p backups
          curl -s --max-time 25 -X POST -H "Content-Type: application/json" -H "X-Webhook-Secret: $WEBHOOK_SECRET" -d "{\"ok\": true, \"criadas\": 0, \"atualizadas\": 0}" "https://api.168.138.232.237.sslip.io/reportar-status-sincronizacao-chamados" -o backups/diag-cleanup.txt
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-cleanup.txt
          git commit -m "diag cleanup [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-cleanup.txt
          git commit -m "diag cleanup [skip ci]" || echo "nothing2"
          git push origin HEAD:main
