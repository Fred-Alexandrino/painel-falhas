name: Ler Config Sistema
on:
  workflow_dispatch: {}
jobs:
  ler:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      WEBHOOK_SECRET: ${{ secrets.FALHAS_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Ler config
        run: |
          mkdir -p backups
          curl -s -H "X-Webhook-Secret: $WEBHOOK_SECRET" "https://api.168.138.232.237.sslip.io/config-ler" -o backups/config-sistema-atual.json
          cat backups/config-sistema-atual.json
      - if: always()
        run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/config-sistema-atual.json
          git diff --quiet --cached || git commit -m "Ler config sistema [skip ci]"
          git push
