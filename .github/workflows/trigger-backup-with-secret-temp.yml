name: Trigger Backup With Secret Temp
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          echo "--- trigger manual backup with secret ---" > backups/diag-backup2.txt
          curl -s -w "\nSTATUS:%{http_code}\n" --max-time 20 -X POST -H "X-Webhook-Secret: ${{ secrets.FALHAS_WEBHOOK_SECRET }}" \
            "https://wpp.147.15.66.241.sslip.io/api/backup-auth" >> backups/diag-backup2.txt
      - if: always()
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git add backups/diag-backup2.txt
          git commit -m "diag backup2 [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-backup2.txt
          git commit -m "diag backup2 [skip ci]" || echo "nothing2"
          git push origin HEAD:main
