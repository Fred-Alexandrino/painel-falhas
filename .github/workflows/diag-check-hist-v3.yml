name: diag-check-hist-v3
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "" | base64 -d > check.py
          python3 check.py > result.txt 2>&1 || true
          cat result.txt
          python3 -c "
import base64, json, urllib.request
content = open('result.txt','rb').read()
b64 = base64.b64encode(content).decode()
payload = json.dumps({'message':'diag: check history v3', 'content': b64}).encode()
req = urllib.request.Request('https://api.github.com/repos/Fred-Alexandrino/painel-falhas/contents/backups/hist-check-v3.txt', data=payload, method='PUT', headers={'Authorization':'token ${{ secrets.GITHUB_TOKEN }}','Accept':'application/vnd.github+json','Content-Type':'application/json'})
try:
    with urllib.request.urlopen(req, timeout=30) as resp:
        print('PUT OK', resp.status)
except Exception as e:
    print('PUT FAILED', str(e))
    if hasattr(e, 'read'):
        print(e.read().decode())
"
