name: Diag Chat IA Erro 2
on:
  workflow_dispatch: {}
jobs:
  testar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Testar chat-ia (3x seguidas)
        run: |
          mkdir -p backups
          for i in 1 2 3; do
            echo "=== Tentativa $i ===" >> backups/diag-chat-ia-erro2.txt
            curl -s -w "\nHTTP_STATUS:%{http_code}\nTIME:%{time_total}s\n" -X POST "https://api.168.138.232.237.sslip.io/chat-ia" \
              -H "Content-Type: application/json" \
              -d '{"pergunta":"quais os principais pontos de atenção de hoje?","historico":[]}' \
              >> backups/diag-chat-ia-erro2.txt
            echo "" >> backups/diag-chat-ia-erro2.txt
            sleep 3
          done
          cat backups/diag-chat-ia-erro2.txt
      - if: always()
        run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-chat-ia-erro2.txt
          git diff --quiet --cached || git commit -m "Diag chat-ia erro 2 [skip ci]"
          git push
