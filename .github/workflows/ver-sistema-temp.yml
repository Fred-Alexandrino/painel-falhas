name: Ver aba Sistema v3
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_VM1_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 168.138.232.237 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Rodar dentro do processo do servico via API interna (usar endpoint existente)
        run: |
          mkdir -p backups
          ssh -i ~/.ssh/id_rsa ubuntu@168.138.232.237 '
            cat /etc/systemd/system/painel-falhas.service | grep -i environment;
            echo "---";
            ls -la ~/painel-falhas/.env*;
            echo "---";
            head -c 100 ~/painel-falhas/.env 2>/dev/null;
          ' > backups/ver-sistema.txt 2>&1 || echo "FALHOU" >> backups/ver-sistema.txt
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/ver-sistema.txt
          git commit -m "ver sistema v3 [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/ver-sistema.txt
          git commit -m "ver sistema v3 [skip ci]" || echo "nothing2"
          git push origin HEAD:main
