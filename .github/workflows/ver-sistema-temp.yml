name: Setar Clusters CE Norte
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          curl -s -w "\nSTATUS:%{http_code}\n" -X POST "https://api.168.138.232.237.sslip.io/config-set-lote" \
            -H "X-Webhook-Secret: falhas2026" -H "Content-Type: application/json" \
            -d '{"pares":{
              "cluster_usina:Guajirú":"CE Norte 02",
              "cluster_usina:Sol do Norte I":"CE Norte 02",
              "cluster_usina:Sol do Norte II":"CE Norte 02",
              "grupo_usina:Guajirú":"120363431221706747@g.us",
              "grupo_usina:Sol do Norte I":"120363431221706747@g.us",
              "grupo_usina:Sol do Norte II":"120363431221706747@g.us",
              "cluster_usina:SunPower (Cascavel)":"CE Norte 01",
              "cluster_usina:Carosa (Aquiraz I)":"CE Norte 01",
              "cluster_usina:Salvales (Aquiraz II)":"CE Norte 01",
              "grupo_usina:SunPower (Cascavel)":"120363428178674382@g.us",
              "grupo_usina:Carosa (Aquiraz I)":"120363428178674382@g.us",
              "grupo_usina:Salvales (Aquiraz II)":"120363428178674382@g.us"
            }}' > backups/set-clusters.txt
          echo "" >> backups/set-clusters.txt
          curl -s -w "\nSTATUS:%{http_code}\n" -X POST "https://api.168.138.232.237.sslip.io/config-limpar-cache" -H "X-Webhook-Secret: falhas2026" >> backups/set-clusters.txt
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/set-clusters.txt
          git commit -m "setar clusters CE Norte [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/set-clusters.txt
          git commit -m "setar clusters CE Norte [skip ci]" || echo "nothing2"
          git push origin HEAD:main
