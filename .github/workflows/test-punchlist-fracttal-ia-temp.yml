name: Test Punchlist Fracttal IA Temp
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          curl -s -w "\nSTATUS:%{http_code}\n" --max-time 150 -X POST \
            -F "fracttalPdf=@backups/7962_teste.pdf;type=application/pdf" \
            -F "cliente=GD Energy" -F "usina=Sol do Norte 2" -F "cluster=CE Leste 01" \
            "https://api.168.138.232.237.sslip.io/extrair-punchlist-fracttal-ia" > backups/diag-punchlist-fracttal-teste.txt
          cat backups/diag-punchlist-fracttal-teste.txt
      - if: always()
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git rm --cached backups/7962_teste.pdf 2>/dev/null || true
          rm -f backups/7962_teste.pdf
          git add backups/diag-punchlist-fracttal-teste.txt
          git commit -m "teste punchlist fracttal ia" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-punchlist-fracttal-teste.txt
          git commit -m "teste punchlist fracttal ia" || echo "nothing2"
          git push origin HEAD:main
