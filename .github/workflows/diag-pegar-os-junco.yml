name: Diag Pegar OS Junco Completa
on:
  workflow_dispatch: {}
jobs:
  buscar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      WEBHOOK_SECRET: ${{ secrets.FALHAS_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Criar script
        run: |
          cat > /tmp/pega.py << 'PYEOF'
          import json, sys
          d = json.load(sys.stdin)
          data = d.get("body", {}).get("data", [])
          for item in data:
              grp = item.get("groups_1_description") or ""
              if "Junco" in grp:
                  print(json.dumps(item, ensure_ascii=False, indent=2))
                  break
          else:
              print("NAO ENCONTRADO NESTA PAGINA")
          PYEOF
      - name: Buscar
        run: |
          BASE="https://api.168.138.232.237.sslip.io"
          mkdir -p backups
          curl -s "$BASE/fracttal-raw?since=2026-03-01T00:00:00-00:00&ot_status=1&start=0&limit=100" \
            -H "X-Webhook-Secret: $WEBHOOK_SECRET" | python3 /tmp/pega.py > backups/os-junco-exemplo.txt
      - if: always()
        run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/os-junco-exemplo.txt
          git diff --quiet --cached || git commit -m "Diagnostico: exemplo completo de OS Junco [skip ci]"
          git push
