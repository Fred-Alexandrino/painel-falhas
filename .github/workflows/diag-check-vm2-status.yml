name: diag-check-vm2-status
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check VM2 health
        run: |
          echo "" | base64 -d > check.py
          mkdir -p backups
          python3 check.py > backups/diag-vm2-status.txt 2>&1 || true
          cat backups/diag-vm2-status.txt
      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Fred-Alexandrino/painel-falhas.git
          git add backups/diag-vm2-status.txt
          git commit -m "diag: check vm2 status" || echo "nothing"
          git push origin HEAD:main
