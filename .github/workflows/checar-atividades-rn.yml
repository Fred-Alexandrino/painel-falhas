name: Checar Atividades RN Temp
on:
  workflow_dispatch: {}
jobs:
  checar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Checar
        run: |
          mkdir -p backups
          curl -s "https://api.168.138.232.237.sslip.io/atividades" -o backups/checar-atividades-rn.json
          python3 -c "
import json
d = json.load(open('backups/checar-atividades-rn.json'))
itens = d if isinstance(d, list) else d.get('itens', d.get('atividades', []))
usinas_rn = ['Thopen - Rodrigues 1 - RN','Thopen - Parelhas 1 - RN','Thopen - Caicó - RN','Thopen - Rodrigues 2 - RN','Thopen - Senador Elói 1 - RN','Thopen - Jucurutu 1 - RN']
for u in usinas_rn:
    do_usina = [a for a in itens if a.get('usina')==u]
    print(u, '->', len(do_usina), 'atividades total')
    for a in do_usina:
        print('   OS', a.get('numeroOS'), '| status:', a.get('status') or a.get('statusGeralOS'), '| cluster:', a.get('cluster'))
"
      - name: Salvar
        if: always()
        run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/checar-atividades-rn.json
          git diff --quiet --cached || git commit -m "Checar atividades RN [skip ci]"
          git push
