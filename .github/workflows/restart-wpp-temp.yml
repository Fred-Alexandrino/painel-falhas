name: Restart WPP Temp
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: SSH restart + wait + check
        env:
          SSH_KEY: ${{ secrets.ORACLE_VM2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/vm2_key
          chmod 600 ~/.ssh/vm2_key
          mkdir -p backups
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vm2_key ubuntu@147.15.66.241 '
            echo "=== restarting ==="
            sudo systemctl restart wppconnect
            sleep 15
            echo "=== status after restart ==="
            sudo systemctl status wppconnect --no-pager | head -10
            echo "=== last 40 log lines ==="
            sudo journalctl -u wppconnect -n 40 --no-pager
          ' > backups/diag-wpp-restart.txt 2>&1
          cat backups/diag-wpp-restart.txt
      - name: Health check after restart
        run: |
          sleep 5
          curl -s -w "\nSTATUS:%{http_code}\n" --max-time 15 "https://wpp.147.15.66.241.sslip.io/health" >> backups/diag-wpp-restart.txt
      - name: Commit and push
        if: always()
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git add backups/diag-wpp-restart.txt
          git commit -m "diag wpp restart [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-wpp-restart.txt
          git commit -m "diag wpp restart [skip ci]" || echo "nothing2"
          git push origin HEAD:main
