name: diag-uptime-fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get monitor id
        run: |
          echo "" | base64 -d > get_monitor.py
          mkdir -p backups
          python3 get_monitor.py > backups/monitor-id.txt 2>&1 || true
          cat backups/monitor-id.txt
      - name: Push
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Fred-Alexandrino/painel-falhas.git
          git add backups/monitor-id.txt || true
          git commit -m "diag: get monitor id" || echo "nothing"
          git push origin HEAD:main || true
