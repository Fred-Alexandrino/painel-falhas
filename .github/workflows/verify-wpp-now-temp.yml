name: Verify WPP Now Temp
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          echo "--- health ---" > backups/diag-verify.txt
          curl -s -w "\nSTATUS:%{http_code} TIME:%{time_total}\n" --max-time 20 "https://wpp.147.15.66.241.sslip.io/health" >> backups/diag-verify.txt
          echo "--- test send to real group (Nova Xavantina) ---" >> backups/diag-verify.txt
          curl -s -w "\nSTATUS:%{http_code} TIME:%{time_total}\n" --max-time 25 -X POST -H "Content-Type: application/json" -H "X-Webhook-Secret: ${{ secrets.FALHAS_WEBHOOK_SECRET }}" \
            -d '{"grupoId":"120363426886851537@g.us","texto":"[teste automatico de diagnostico Claude - pode ignorar/apagar]"}' \
            "https://wpp.147.15.66.241.sslip.io/api/enviar-mensagem" >> backups/diag-verify.txt
      - if: always()
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git add backups/diag-verify.txt
          git commit -m "diag verify [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-verify.txt
          git commit -m "diag verify [skip ci]" || echo "nothing2"
          git push origin HEAD:main
