name: Rodar Auditoria Completa Temp
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          curl -s -w "\nSTATUS:%{http_code}\n" --max-time 110 -X POST "https://api.168.138.232.237.sslip.io/rodar-auditoria-agora" > backups/diag-auditoria-completa.txt
          cat backups/diag-auditoria-completa.txt
      - if: always()
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git add backups/diag-auditoria-completa.txt
          git commit -m "auditoria completa manual" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-auditoria-completa.txt
          git commit -m "auditoria completa manual" || echo "nothing2"
          git push origin HEAD:main
