name: Diag Historico Fracttal (temp)

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run diag
        env:
          WEBHOOK_SECRET: ${{ secrets.FALHAS_WEBHOOK_SECRET }}
        run: |
          echo "" | base64 -d > diag_hist.py
          pip install requests --quiet
          python3 diag_hist.py
          cat backups/diag-hist-summary.txt
      - name: Commit result
        if: always()
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git add backups/diag-hist-summary.txt backups/diag-hist-full.json
          git diff --quiet --cached || git commit -m "Diag: historico fracttal OS 10285 [skip ci]"
          git push
