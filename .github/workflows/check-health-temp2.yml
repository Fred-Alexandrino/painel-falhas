name: Check Health Temp2
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          curl -sv -w "\nSTATUS:%{http_code}\n" --max-time 20 "https://wpp.147.15.66.241.sslip.io/health" > backups/diag-health2.txt 2>&1 || echo "curl failed rc=$?" >> backups/diag-health2.txt
      - if: always()
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git add backups/diag-health2.txt
          git commit -m "diag health2 [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-health2.txt
          git commit -m "diag health2 [skip ci]" || echo "nothing2"
          git push origin HEAD:main
