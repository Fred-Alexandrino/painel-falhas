name: Checar Supervisao Temporaria (temporario)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Buscar estado atual
        run: |
          set -e
          mkdir -p backups
          curl -sS "https://api.168.138.232.237.sslip.io/supervisao-temporaria" \
            -o backups/teste-supervisao-atual.json
          cat backups/teste-supervisao-atual.json

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/teste-supervisao-atual.json
          git commit -m "Teste temporario: estado atual supervisao temporaria" || echo "Nada para commitar"
          git push
