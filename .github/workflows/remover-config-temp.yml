name: Remover Config Temp (Claude)
on:
  workflow_dispatch: {}
jobs:
  remover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      WEBHOOK_SECRET: ${{ secrets.FALHAS_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Remover chaves antigas
        run: |
          mkdir -p backups
          curl -s -X POST "https://api.168.138.232.237.sslip.io/config-remover" \
            -H "X-Webhook-Secret: $WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"chaves": ["cluster_usina:Carosa (Aquiraz I)", "cluster_usina:Salvales (Aquiraz II)", "grupo_usina:Carosa (Aquiraz I)", "grupo_usina:Salvales (Aquiraz II)"]}' \
            -o backups/remover-config-result.json
          cat backups/remover-config-result.json
      - if: always()
        run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/remover-config-result.json
          git diff --quiet --cached || git commit -m "Remover config temp [skip ci]"
          git push
