name: Diag Endpoint Historico Fracttal Novo (temp)

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run diag
        run: |
          echo "" | base64 -d > diag_endpoint.py
          pip install requests --quiet
          python3 diag_endpoint.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git add backups/diag-endpoint-novo.json
          git diff --quiet --cached || git commit -m "Diag: endpoint novo historico fracttal [skip ci]"
          git push
