name: Backfill Loop Sal Energia
on:
  workflow_dispatch: {}
jobs:
  t:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          WEBHOOK_SECRET: ${{ secrets.FALHAS_WEBHOOK_SECRET }}
        run: |
          echo "[]" > sal_encontradas.json
          for START in 100 200 300 400 500 600 700 800 900 1000 1100 1200 1300 1400 1500; do
            R=$(curl -s -m 50 -X POST "https://api.168.138.232.237.sslip.io/backfill-fracttal?start=$START&limit=100" -H "X-Webhook-Secret: $WEBHOOK_SECRET")
            echo "$R" | python3 -c "
import json, sys
try:
    d = json.load(sys.stdin)
    criadas = [c for c in d.get('criadas', []) if c.get('cliente') == 'Sal Energia']
    print(f'start=$START: total_geral={d.get(\"total_geral\")} criadas_geral={len(d.get(\"criadas\",[]))} sal_energia={len(criadas)}')
    for c in criadas:
        print('  ->', c)
except Exception as e:
    print(f'start=$START: erro ao processar - {e}')
"
            sleep 1
          done > resumo_loop.txt
          cat resumo_loop.txt
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          mkdir -p backups
          cp resumo_loop.txt backups/resumo-backfill-sal.txt
          git add backups/resumo-backfill-sal.txt
          git commit -m "backfill loop sal energia [skip ci]"
          n=0
          until git push || [ $n -ge 6 ]; do
            n=$((n+1))
            sleep 3
            git pull --rebase origin main
          done
