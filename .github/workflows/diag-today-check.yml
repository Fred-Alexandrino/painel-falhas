name: diag-today-check
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test direct enviar-mensagem endpoint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "" | base64 -d > check.py
          python3 check.py > result.txt 2>&1 || true
          cat result.txt
          CONTENT_B64=$(base64 -w0 result.txt)
          EXISTING_SHA=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/Fred-Alexandrino/painel-falhas/contents/backups/today-check.txt" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('sha',''))")
          if [ -n "$EXISTING_SHA" ]; then
            PAYLOAD="{\"message\":\"diag: direct send test\",\"content\":\"$CONTENT_B64\",\"sha\":\"$EXISTING_SHA\"}"
          else
            PAYLOAD="{\"message\":\"diag: direct send test\",\"content\":\"$CONTENT_B64\"}"
          fi
          echo "$PAYLOAD" > /tmp/payload.json
          curl -s -X PUT -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Fred-Alexandrino/painel-falhas/contents/backups/today-check.txt" \
            -d @/tmp/payload.json -w "\nHTTP:%{http_code}\n"
