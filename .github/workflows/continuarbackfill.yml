name: Continuar Backfill Sal Energia
on:
  workflow_dispatch: {}
jobs:
  t:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          WEBHOOK_SECRET: ${{ secrets.FALHAS_WEBHOOK_SECRET }}
        run: |
          BASE="https://api.168.138.232.237.sslip.io"
          SINCE="2026-03-01T00:00:00-00:00"
          START=2300
          LIMIT=100
          PAGINA=24
          mkdir -p backups
          echo "Continuacao do backfill a partir de start=2300" > backups/backfill-continuacao.txt
          while true; do
            RESPONSE=$(curl -s -w "\n%{http_code}" "$BASE/backfill-fracttal?since=$SINCE&ot_status=1&start=$START&limit=$LIMIT" -H "X-Webhook-Secret: $WEBHOOK_SECRET")
            BODY=$(echo "$RESPONSE" | head -n -1)
            STATUS=$(echo "$RESPONSE" | tail -n 1)
            {
              echo "===== Pagina $PAGINA (start=$START) — HTTP $STATUS ====="
              echo "$BODY"
              echo ""
            } >> backups/backfill-continuacao.txt
            if [ "$STATUS" -ge 400 ]; then
              echo "::error::falhou na pagina $PAGINA"
              break
            fi
            TEM_MAIS=$(echo "$BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('tem_mais', False))")
            PROXIMO_START=$(echo "$BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('proximo_start', -1))")
            if [ "$TEM_MAIS" != "True" ] || [ "$PROXIMO_START" -eq "-1" ]; then
              break
            fi
            START=$PROXIMO_START
            PAGINA=$((PAGINA + 1))
            sleep 3
          done
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/backfill-continuacao.txt
          git diff --quiet --cached || git commit -m "backfill continuacao [skip ci]"
          n=0
          until git push || [ $n -ge 8 ]; do
            n=$((n+1))
            sleep 3
            git pull --rebase origin main
          done
