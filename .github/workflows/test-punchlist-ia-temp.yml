name: Test Punchlist IA Temp
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          curl -s -w "\nSTATUS:%{http_code}\n" --max-time 30 -X POST -H "Content-Type: application/json" \
            --data @backups/test_punchlist_payload.json \
            "https://api.168.138.232.237.sslip.io/gerar-punchlist-ia" > backups/diag-punchlist-teste.txt
          cat backups/diag-punchlist-teste.txt
      - if: always()
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git add backups/diag-punchlist-teste.txt
          git commit -m "teste punchlist ia" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-punchlist-teste.txt
          git commit -m "teste punchlist ia" || echo "nothing2"
          git push origin HEAD:main
