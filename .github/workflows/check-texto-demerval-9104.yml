name: check-texto-demerval-9104
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Curl endpoint
        run: |
          curl -s "https://api.168.138.232.237.sslip.io/gerar-comunicado-sobreaviso?bloco=1" > result.txt
      - name: Commit result
        run: |
          git config user.name "bot"
          git config user.email "bot@example.com"
          cp result.txt backups/check-texto-demerval-result.txt
          git add backups/check-texto-demerval-result.txt
          git commit -m "check texto demerval" || echo "nothing to commit"
          git push
