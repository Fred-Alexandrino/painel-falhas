name: test-solplanet-api

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test with Accept header + verbose headers - no token
        run: |
          curl -sv -H "Accept: application/json" \
            "https://ap-southeast-1-api-genergal.aisweicloud.com/pro/getPlantOverviewPro?apikey=75a973d76e00483c93d6e98fb79da4cc" \
            > result_a.txt 2>&1 || true

      - name: Test with Accept header + token=appsecret
        run: |
          curl -sv -H "Accept: application/json" \
            "https://ap-southeast-1-api-genergal.aisweicloud.com/pro/getPlantOverviewPro?apikey=75a973d76e00483c93d6e98fb79da4cc&token=OK9oG0sbSeiNZAKTB5VOa8R9CQqTqLuT" \
            > result_b.txt 2>&1 || true

      - name: Test getPlanListPro with Accept header
        run: |
          curl -sv -H "Accept: application/json" \
            "https://ap-southeast-1-api-genergal.aisweicloud.com/pro/getPlanListPro?pageNum=1&pageSize=10&token=OK9oG0sbSeiNZAKTB5VOa8R9CQqTqLuT" \
            > result_c.txt 2>&1 || true

      - name: Test EU domain from library for comparison
        run: |
          curl -sv -H "Accept: application/json" \
            "https://eu-api-genergal.aisweicloud.com/pro/getPlantOverviewPro?apikey=75a973d76e00483c93d6e98fb79da4cc&token=OK9oG0sbSeiNZAKTB5VOa8R9CQqTqLuT" \
            > result_d.txt 2>&1 || true

      - name: Save combined results
        run: |
          mkdir -p backups
          {
            echo "=== A: no_token_with_accept_header ==="; cat result_a.txt;
            echo ""; echo "=== B: appsecret_as_token_with_accept ==="; cat result_b.txt;
            echo ""; echo "=== C: getPlanListPro_with_token ==="; cat result_c.txt;
            echo ""; echo "=== D: eu_domain ==="; cat result_d.txt;
          } > backups/solplanet-test-result2.txt

      - name: Commit and push results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Fred-Alexandrino/painel-falhas.git
          git add backups/solplanet-test-result2.txt
          git commit -m "test: solplanet api diagnostic result v2 verbose" || echo "nothing to commit"
          git push origin HEAD:main
