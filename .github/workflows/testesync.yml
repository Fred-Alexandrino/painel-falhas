name: Teste Sync Indicator
on:
  workflow_dispatch: {}
jobs:
  t:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          WEBHOOK_SECRET: ${{ secrets.FALHAS_WEBHOOK_SECRET }}
        run: |
          SYNC=$(curl -s -m 20 -X POST "https://api.168.138.232.237.sslip.io/sincronizar-chamados" -H "X-Webhook-Secret: $WEBHOOK_SECRET" -H "Content-Type: application/json" -d '[{"Ticket/RMA":"TESTE-SYNC-IND","Ativo":"teste","UFV":"Geral - Geral","Data da ocorrência":"24/07/2026","Status":"Aberto"}]')
          sleep 2
          LISTAR=$(curl -s -m 20 "https://api.168.138.232.237.sslip.io/chamados-fabricante" | python3 -c "import json,sys; d=json.load(sys.stdin); print('ultimaSincronizacao:', d.get('ultimaSincronizacao'))")
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git commit --allow-empty -m "TESTESYNC sync=[$SYNC] listar=[$LISTAR]"
          n=0
          until git push || [ $n -ge 6 ]; do
            n=$((n+1))
            sleep 3
            git pull --rebase origin main
          done
