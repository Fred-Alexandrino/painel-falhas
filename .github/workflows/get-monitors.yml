name: get-monitors

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get monitors
        run: |
          echo "" | base64 -d > get_monitors.py
          mkdir -p backups
          python3 get_monitors.py > backups/monitors-list.txt 2>&1 || true
          cat backups/monitors-list.txt
      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Fred-Alexandrino/painel-falhas.git
          git add backups/monitors-list.txt
          git commit -m "chore: list monitors" || echo "nothing"
          git push origin HEAD:main
