name: Adicionar Grupo WhatsApp (GRUPOS_IDS)
on:
  workflow_dispatch:
    inputs:
      grupo_id:
        description: 'ID do grupo (ex: 120363427259899891@g.us)'
        required: true
jobs:
  adicionar:
    runs-on: ubuntu-latest
    steps:
      - name: Adicionar ID ao GRUPOS_IDS via SSH e reiniciar serviço
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 168.138.232.237
          username: ubuntu
          key: ${{ secrets.ORACLE_VM1_SSH_KEY }}
          envs: GRUPO_ID_NOVO
          script: |
            set -e
            cd ~/painel-falhas
            echo "=== .env ANTES ==="
            grep GRUPOS_IDS .env || echo "(GRUPOS_IDS não encontrado no .env)"
            if grep -q "$GRUPO_ID_NOVO" .env; then
              echo "Grupo já presente no GRUPOS_IDS, nada a fazer."
            else
              sed -i "/^GRUPOS_IDS=/ s/\$/,${GRUPO_ID_NOVO}/" .env
              echo "Grupo adicionado."
            fi
            echo "=== .env DEPOIS ==="
            grep GRUPOS_IDS .env
            sudo systemctl restart painel-falhas
            sleep 3
            sudo systemctl is-active painel-falhas
        env:
          GRUPO_ID_NOVO: ${{ github.event.inputs.grupo_id }}
