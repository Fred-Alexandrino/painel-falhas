name: diag-daily-summary
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check sync-fracttal live
        timeout-minutes: 5
        run: |
          echo "" | base64 -d > check_sync.py
          mkdir -p backups
          python3 check_sync.py > backups/diag-result2.txt 2>&1 || true
          cat backups/diag-result2.txt
      - name: Push
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Fred-Alexandrino/painel-falhas.git
          git add backups/diag-result2.txt || true
          git commit -m "diag: sync-fracttal live test" || echo "nothing"
          git push origin HEAD:main || true
