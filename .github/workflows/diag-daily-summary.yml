name: diag-daily-summary
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check VM1
        run: |
          echo "" | base64 -d > check_vm1.py
          mkdir -p backups
          python3 check_vm1.py > backups/diag-result.txt 2>&1 || true
      - name: Check UptimeRobot
        run: |
          echo "" | base64 -d > check_up.py
          python3 check_up.py >> backups/diag-result.txt 2>&1 || true
          cat backups/diag-result.txt
      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Fred-Alexandrino/painel-falhas.git
          git add backups/diag-result.txt
          git commit -m "diag: daily summary check" || echo "nothing"
          git push origin HEAD:main
