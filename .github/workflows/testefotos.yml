name: Teste Fotos Atividade
on:
  workflow_dispatch: {}
jobs:
  t:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "" | base64 -d > foto_teste.jpg
          echo "=== 1. criar atividade de teste (manual, sem numeroOS) ===" > resultado.txt
          CRIAR=$(curl -s -m 20 -X POST "https://api.168.138.232.237.sslip.io/nova-atividade" -H "Content-Type: application/json" -d '{"cliente":"Geral","usina":"Geral","descricao":"TESTE FOTO - pode apagar","editor":"teste-automatizado"}')
          echo "$CRIAR" >> resultado.txt
          ID=$(echo "$CRIAR" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))")
          echo "ID criado: $ID" >> resultado.txt

          echo "" >> resultado.txt
          echo "=== 2. anexar foto ===" >> resultado.txt
          curl -s -m 20 -X POST "https://api.168.138.232.237.sslip.io/atividade-anexar-foto" -F "id=$ID" -F "foto=@foto_teste.jpg" >> resultado.txt

          echo "" >> resultado.txt
          echo "=== 3. listar fotos ===" >> resultado.txt
          curl -s -m 20 "https://api.168.138.232.237.sslip.io/atividade-fotos/$ID" >> resultado.txt

          echo "" >> resultado.txt
          echo "=== 4. testar restricao (id falso simulando OS da fracttal) ===" >> resultado.txt
          curl -s -m 20 -X POST "https://api.168.138.232.237.sslip.io/atividade-anexar-foto" -F "id=ID_INEXISTENTE_999" -F "foto=@foto_teste.jpg" >> resultado.txt

          cat resultado.txt
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          C=$(cat resultado.txt | tr '\n' '|' | head -c 900)
          git commit --allow-empty -m "TESTEFOTOS=[$C]"
          git push
