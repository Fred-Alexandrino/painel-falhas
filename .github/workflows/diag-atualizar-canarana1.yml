name: diag-atualizar-canarana1
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint e gravar resultado via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESP=$(curl -s -X POST "https://api.168.138.232.237.sslip.io/localizacoes-atualizar-coords" \
            -H "Content-Type: application/json" \
            -d '{"cliente":"Thopen","usina":"Canarana I","lat":-13.5212907,"lng":-52.2899134}')
          echo "$RESP"
          B64=$(printf '%s' "$RESP" | base64 -w0)
          SHA=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/Fred-Alexandrino/painel-falhas/contents/backups/diag-atualizar-canarana1.json" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('sha',''))")
          if [ -n "$SHA" ]; then
            curl -s -X PUT "https://api.github.com/repos/Fred-Alexandrino/painel-falhas/contents/backups/diag-atualizar-canarana1.json" \
              -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/json" \
              -d "{\"message\":\"diag: resultado canarana1\",\"content\":\"$B64\",\"sha\":\"$SHA\"}"
          else
            curl -s -X PUT "https://api.github.com/repos/Fred-Alexandrino/painel-falhas/contents/backups/diag-atualizar-canarana1.json" \
              -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/json" \
              -d "{\"message\":\"diag: resultado canarana1\",\"content\":\"$B64\"}"
          fi
