name: Diag Check Grupos Configurados
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          curl -s "https://api.168.138.232.237.sslip.io/grupos-configurados" -o backups/check-grupos-configurados.json
          cat backups/check-grupos-configurados.json
      - if: always()
        run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/check-grupos-configurados.json
          git diff --quiet --cached || git commit -m "check grupos configurados [skip ci]"
          git push
