name: Diag Prova Sync Automatico 2

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rodar o mesmo sync automatico que roda a cada 5min (sem secret, igual UptimeRobot)
        run: |
          mkdir -p backups
          curl -s "https://api.168.138.232.237.sslip.io/sync-fracttal" -o backups/prova-sync-result.json
          cat backups/prova-sync-result.json
      - name: Salvar resultado
        if: always()
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git add backups/prova-sync-result.json
          git diff --quiet --cached || git commit -m "Prova sync automatico [skip ci]"
          git push
