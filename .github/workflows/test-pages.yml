name: test-pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          echo "" | base64 -d > test_pages.py
          mkdir -p backups
          python3 test_pages.py > backups/pages-test.txt 2>&1 || true
          cat backups/pages-test.txt
      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Fred-Alexandrino/painel-falhas.git
          git add backups/pages-test.txt
          git commit -m "test: pages check" || echo "nothing"
          git push origin HEAD:main
