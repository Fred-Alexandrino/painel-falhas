name: Diagnostico VM2 status agora (temp)
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          {
            echo "=== /health VM2 ==="
            curl -s --max-time 15 -w "\nHTTP:%{http_code}\n" "https://wpp.147.15.66.241.sslip.io/health"
            echo ""
            echo "=== /status VM2 ==="
            curl -s --max-time 15 -w "\nHTTP:%{http_code}\n" "https://wpp.147.15.66.241.sslip.io/status"
          } > backups/diag-vm2-status2.txt 2>&1
      - name: Commitar
        if: always()
        run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-vm2-status2.txt
          git commit -m "diag vm2 status 2 [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-vm2-status2.txt
          git commit -m "diag vm2 status 2 [skip ci]" || echo "nothing2"
          git push origin HEAD:main
