name: Diagnostico Checar Resumo Gerado (temp)
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          {
            echo "=== /resumos limit=3 ==="
            curl -s --max-time 20 "https://api.168.138.232.237.sslip.io/resumos?tipo=diario&limit=3"
            echo ""
            echo "=== chamada direta gerar-resumo-diario com secret e enviar=false pra ver erro ==="
            curl -s --max-time 90 -w "\nHTTP:%{http_code}\n" "https://api.168.138.232.237.sslip.io/gerar-resumo-diario?secret=falhas2026&enviar=false"
          } > backups/diag-check-resumo2.txt 2>&1
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-check-resumo2.txt
          git commit -m "diag check resumo 2 [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-check-resumo2.txt
          git commit -m "diag check resumo 2 [skip ci]" || echo "nothing2"
          git push origin HEAD:main
