name: Diagnostico Enviar Resumo De Verdade (temp)
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          curl -s --max-time 90 -w "\nHTTP:%{http_code}\n" "https://api.168.138.232.237.sslip.io/gerar-resumo-diario?secret=falhas2026&enviar=true" > backups/diag-envia-resumo.txt 2>&1
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-envia-resumo.txt
          git commit -m "diag envia resumo [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-envia-resumo.txt
          git commit -m "diag envia resumo [skip ci]" || echo "nothing2"
          git push origin HEAD:main
