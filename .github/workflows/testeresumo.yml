name: Teste Resumo Diario
on:
  workflow_dispatch: {}
jobs:
  t:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          WEBHOOK_SECRET: ${{ secrets.FALHAS_WEBHOOK_SECRET }}
        run: |
          echo "=== health ===" > resultado.txt
          curl -s -m 15 "https://api.168.138.232.237.sslip.io/health" >> resultado.txt
          echo "" >> resultado.txt
          echo "=== gerar resumo diario (sem enviar) ===" >> resultado.txt
          curl -s -m 60 -X POST "https://api.168.138.232.237.sslip.io/gerar-resumo-diario?enviar=false" -H "X-Webhook-Secret: $WEBHOOK_SECRET" >> resultado.txt
          cat resultado.txt
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          C=$(cat resultado.txt | head -c 3500)
          git commit --allow-empty -m "TESTERESUMO=[$C]"
          n=0
          until git push || [ $n -ge 8 ]; do
            n=$((n+1))
            sleep 3
            git pull --rebase origin main
          done
