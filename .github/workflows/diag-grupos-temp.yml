name: Diagnostico Grupos Configurados
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          curl -s -w "\nSTATUS:%{http_code}\n" --max-time 20 "https://api.168.138.232.237.sslip.io/grupos-configurados" -o backups/diag-grupos.txt
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-grupos.txt
          git commit -m "diag grupos [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-grupos.txt
          git commit -m "diag grupos [skip ci]" || echo "nothing2"
          git push origin HEAD:main
