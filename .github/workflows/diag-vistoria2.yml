name: Diag Vistoria Colaboradores 2
on:
  workflow_dispatch: {}
jobs:
  ler:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ler atividades
        run: |
          mkdir -p backups
          curl -s "https://api.168.138.232.237.sslip.io/atividades" -o backups/diag-atividades2.json
          wc -c backups/diag-atividades2.json
      - if: always()
        run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-atividades2.json
          git diff --quiet --cached || git commit -m "Diag vistoria colaboradores 2 [skip ci]"
          git push
