name: Diag TXU Chamados (temp)

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run diag
        run: |
          echo "" | base64 -d > diag_txu.py
          pip install requests --quiet
          python3 diag_txu.py
          mkdir -p backups
          cp out_txu.json backups/debug-txu-chamados.json
      - name: Commit result
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git add backups/debug-txu-chamados.json
          git diff --quiet --cached || git commit -m "Diag: TXU chamados [skip ci]"
          git push
