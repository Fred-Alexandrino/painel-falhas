name: Ler Localizacoes Temp
on:
  workflow_dispatch: {}
jobs:
  ler:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ler localizacoes
        run: |
          mkdir -p backups
          curl -s "https://api.168.138.232.237.sslip.io/localizacoes" -o backups/localizacoes-atual.json
          cat backups/localizacoes-atual.json
      - if: always()
        run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/localizacoes-atual.json
          git diff --quiet --cached || git commit -m "Ler localizacoes temp [skip ci]"
          git push
