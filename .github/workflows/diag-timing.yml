name: Diag Chat IA Timing
on:
  workflow_dispatch: {}
jobs:
  testar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Testar chat-ia 5x com timing
        run: |
          mkdir -p backups
          > backups/diag-timing.txt
          for i in 1 2 3 4 5; do
            echo "=== Tentativa $i - $(date -u +%H:%M:%S) ===" >> backups/diag-timing.txt
            curl -s -w "\nHTTP_STATUS:%{http_code} TIME:%{time_total}s\n" -X POST "https://api.168.138.232.237.sslip.io/chat-ia" \
              -H "Content-Type: application/json" \
              -d '{"pergunta":"quais os principais pontos de atenção de hoje?","historico":[]}' \
              --max-time 170 \
              >> backups/diag-timing.txt 2>&1
            echo "" >> backups/diag-timing.txt
          done
          echo "=== /health ===" >> backups/diag-timing.txt
          curl -s -w "\nHTTP_STATUS:%{http_code} TIME:%{time_total}s\n" "https://api.168.138.232.237.sslip.io/health" >> backups/diag-timing.txt
          cat backups/diag-timing.txt
      - if: always()
        run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-timing.txt
          git diff --quiet --cached || git commit -m "Diag timing chat-ia [skip ci]"
          git push
