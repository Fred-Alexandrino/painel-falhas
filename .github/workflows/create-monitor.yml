name: create-fv-monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create monitor
        run: |
          echo "" | base64 -d > create_monitor.py
          mkdir -p backups
          python3 create_monitor.py > backups/monitor-create-result.txt 2>&1 || true
          cat backups/monitor-create-result.txt
      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Fred-Alexandrino/painel-falhas.git
          git add backups/monitor-create-result.txt
          git commit -m "chore: create fv monitor result" || echo "nothing"
          git push origin HEAD:main
