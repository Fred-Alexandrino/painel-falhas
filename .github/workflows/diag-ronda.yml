name: diag-ronda
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diag
        run: |
          echo "" | base64 -d > diag_ronda.py
          mkdir -p backups
          python3 diag_ronda.py > backups/diag-ronda-result.txt 2>&1 || true
          cat backups/diag-ronda-result.txt
      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Fred-Alexandrino/painel-falhas.git
          git add backups/diag-ronda-result.txt
          git commit -m "diag: ronda 8h" || echo "nothing"
          git push origin HEAD:main
