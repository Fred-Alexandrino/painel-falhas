name: test-fv-energias-endpoint

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test /fv-energias/status
        run: |
          echo "" | base64 -d > test_endpoint.py
          mkdir -p backups
          python3 test_endpoint.py > backups/fv-energias-status-result.txt 2>&1 || true
          cat backups/fv-energias-status-result.txt
      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Fred-Alexandrino/painel-falhas.git
          git add backups/fv-energias-status-result.txt
          git commit -m "test: fv-energias status endpoint" || echo "nothing to commit"
          git push origin HEAD:main
