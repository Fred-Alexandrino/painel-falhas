name: Diag Zeladoria Sheet
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          STATUS=$(curl -sL -w "%{http_code}" --max-time 20 \
            "https://docs.google.com/spreadsheets/d/1VLo8__wxSJVWiUIFd_JTcOnadJlUt440i1M1pC0ehTs/export?format=csv&gid=987654321" \
            -o backups/diag-zeladoria.csv)
          echo "STATUS_HTTP=$STATUS" > backups/diag-zeladoria-status.txt
          echo "TAMANHO_BYTES=$(wc -c < backups/diag-zeladoria.csv)" >> backups/diag-zeladoria-status.txt
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-zeladoria.csv backups/diag-zeladoria-status.txt
          git commit -m "diag zeladoria sheet [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-zeladoria.csv backups/diag-zeladoria-status.txt
          git commit -m "diag zeladoria sheet [skip ci]" || echo "nothing2"
          git push origin HEAD:main
