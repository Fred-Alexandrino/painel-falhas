name: Fix TXU Chamados (temp)

on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run fix
        run: |
          echo "" | base64 -d > fix_txu.py
          pip install requests --quiet
          python3 fix_txu.py
          mkdir -p backups
          cp out_fix_txu.json backups/debug-fix-txu-chamados.json
      - name: Commit result
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git add backups/debug-fix-txu-chamados.json
          git diff --quiet --cached || git commit -m "Fix: TXU->TCU chamados [skip ci]"
          git push
