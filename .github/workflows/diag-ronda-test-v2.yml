name: diag-ronda-test-v2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Test gerar-ronda
        run: |
          echo "" | base64 -d > check.py
          mkdir -p backups
          python3 check.py > backups/ronda-test-result.txt 2>&1 || true
          cat backups/ronda-test-result.txt
      - name: Push
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Fred-Alexandrino/painel-falhas.git
          git fetch origin main
          git reset --mixed origin/main
          git add backups/ronda-test-result.txt
          git status
          git commit -m "diag: ronda test v2" || echo "nothing to commit"
          git push origin HEAD:main -v || (echo "PUSH_FAILED"; git log -3; git remote -v)
