name: Diag WPP Auth Temp
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Testar auth do webhook secret contra VM2 (grupo falso, so pra ver se autentica)
        env:
          WEBHOOK_SECRET: ${{ secrets.FALHAS_WEBHOOK_SECRET }}
        run: |
          mkdir -p backups
          set +e
          curl -sv --max-time 20 -X POST \
            -H "X-Webhook-Secret: $WEBHOOK_SECRET" -H "Content-Type: application/json" \
            -d '{"grupoId":"0000000000-000000@g.us","texto":"__diag_teste_auth__"}' \
            "https://wpp.147.15.66.241.sslip.io/api/enviar-mensagem" > backups/diag-wpp-auth.txt 2>&1
          echo "CURL_EXIT_CODE:$?" >> backups/diag-wpp-auth.txt
          exit 0
      - if: always()
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git add backups/diag-wpp-auth.txt
          git commit -m "diag wpp auth v2 [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-wpp-auth.txt
          git commit -m "diag wpp auth v2 [skip ci]" || echo "nothing2"
          git push origin HEAD:main
