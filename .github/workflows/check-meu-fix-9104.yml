name: check-meu-fix-9104
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Curl endpoint
        run: |
          curl -s -X POST "https://api.168.138.232.237.sslip.io/sobreaviso-meu" -H "Content-Type: application/json" -d '{"bloco":1,"audiencia":"tecnicos","grupos":["Araputanga / Poconé"]}' > result.txt
      - name: Commit result
        run: |
          git config user.name "bot"
          git config user.email "bot@example.com"
          mkdir -p backups
          cp result.txt backups/check-meu-fix-result.txt
          git add backups/check-meu-fix-result.txt
          git commit -m "check meu fix" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
