name: diag-vm2-logs2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSH and capture logs
        env:
          SSH_KEY: ${{ secrets.ORACLE_VM2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/vm2.key
          chmod 600 ~/.ssh/vm2.key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vm2.key ubuntu@147.15.66.241 \
            "sudo journalctl -u wppconnect --since '-45min' --no-pager | tail -400" > backups/diag-vm2-logs2.txt 2>&1 || true
      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Fred-Alexandrino/painel-falhas.git
          git add backups/diag-vm2-logs2.txt
          git commit -m "diag: vm2 journal logs" || echo "nothing"
          git push origin HEAD:main
