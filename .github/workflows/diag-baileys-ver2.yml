name: diag-baileys-ver2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check baileys version on VM2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 147.15.66.241
          username: ubuntu
          key: ${{ secrets.ORACLE_VM2_SSH_KEY }}
          script: |
            echo "=== baileys version ===" > /tmp/verdiag.txt
            cd ~/wppconnect-server
            grep '"version"' node_modules/@whiskeysockets/baileys/package.json >> /tmp/verdiag.txt 2>&1
            echo "=== node version ===" >> /tmp/verdiag.txt
            node --version >> /tmp/verdiag.txt 2>&1
            echo "=== package.json declared ===" >> /tmp/verdiag.txt
            grep baileys package.json >> /tmp/verdiag.txt 2>&1
      - name: Fetch and push result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_VM2_SSH_KEY }}" > /tmp/key.pem
          chmod 600 /tmp/key.pem
          scp -o StrictHostKeyChecking=no -i /tmp/key.pem ubuntu@147.15.66.241:/tmp/verdiag.txt /tmp/verdiag.txt
          cat /tmp/verdiag.txt
          echo "" | base64 -d > /tmp/push_result.py
          python3 /tmp/push_result.py
