name: Diag Cliente Raw

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ver campo cliente raw
        run: |
          mkdir -p backups
          curl -s "https://api.168.138.232.237.sslip.io/atividades" -o backups/atividades-full.json
          python3 -c "
import json
d = json.load(open('backups/atividades-full.json'))
for a in d.get('atividades', []):
    if a.get('numeroOS') in ('10142','8904'):
        print(a.get('numeroOS'), repr(a.get('cliente')), repr(a.get('usina')))
"
      - name: Salvar resultado
        if: always()
        run: |
          git pull --rebase origin main || true
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git add backups/atividades-full.json 2>/dev/null || true
          git diff --quiet --cached || git commit -m "diag cliente [skip ci]"
          git push || true
