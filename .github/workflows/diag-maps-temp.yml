name: Diagnostico Resolver Links Maps
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_VM1_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 168.138.232.237 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Testar resolucao de link curto do Maps a partir do VM1
        run: |
          mkdir -p backups
          ssh -i ~/.ssh/id_rsa ubuntu@168.138.232.237 '
            curl -s -L -o /dev/null -w "URL_FINAL:%{url_effective}\nHTTP_STATUS:%{http_code}\n" "https://maps.app.goo.gl/qvLsNF1xkcoJHk1d7";
          ' > backups/diag-maps-link.txt 2>&1 || echo "SSH_FALHOU" >> backups/diag-maps-link.txt
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-maps-link.txt
          git commit -m "diag maps link [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-maps-link.txt
          git commit -m "diag maps link [skip ci]" || echo "nothing2"
          git push origin HEAD:main
