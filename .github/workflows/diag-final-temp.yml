name: Diagnostico Final Verificacao
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_VM1_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 168.138.232.237 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Verificar commit e rotas no disco
        run: |
          mkdir -p backups
          ssh -i ~/.ssh/id_rsa ubuntu@168.138.232.237 '
            cd ~/painel-falhas;
            echo "=== commit no disco ===";
            git log -1 --format="%H %ci";
            echo "=== rotas criticas ===";
            grep -c "def listar_localizacoes\|def geocodificar_localizacoes_servidor\|def excluir_atividade\|not texto_usado.strip()\|atividade-anexar-foto" app.py;
            echo "=== status servico ===";
            sudo systemctl is-active painel-falhas;
          ' > backups/diag-final.txt 2>&1 || echo "SSH_FALHOU" >> backups/diag-final.txt
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-final.txt
          git commit -m "diag final [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-final.txt
          git commit -m "diag final [skip ci]" || echo "nothing2"
          git push origin HEAD:main
