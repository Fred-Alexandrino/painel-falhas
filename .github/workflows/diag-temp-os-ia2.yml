name: Diagnostico OS IA 2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chamar endpoint
        run: |
          curl -sS -X POST "https://api.168.138.232.237.sslip.io/gerar-texto-os-ia?diagnostico=true" \
            -H "Content-Type: application/json" \
            -H "X-Usar-Chave-Teste: true" \
            --data @- << 'PAYLOAD' > backups/diag-os-resultado2.json
          {
            "cliente": "Sal Energia",
            "usina": "Cascavel 1 (Sunpower)",
            "equipamento": "SALE-SNP100-DINV6.2",
            "falha": "Datalogger do inversor com defeito de comunicacao, precisa ser substituido.",
            "causa": "", "acao": "", "historico": "", "responsavel": ""
          }
          PAYLOAD
          cat backups/diag-os-resultado2.json
      - name: Commit resultado
        run: |
          git config user.name "diag-bot"
          git config user.email "diag-bot@users.noreply.github.com"
          git add backups/diag-os-resultado2.json
          git commit -m "diag2" || echo "sem mudancas"
          git push
