name: Patch Timeout Gunicorn (temporario)
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Localizar e corrigir o timeout no systemd + reiniciar
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 168.138.232.237
          username: ubuntu
          key: ${{ secrets.ORACLE_VM1_SSH_KEY }}
          script: |
            echo "=== Arquivo de servico ANTES ==="
            sudo grep -n "ExecStart" /etc/systemd/system/painel-falhas.service
            sudo sed -i 's/--timeout 120/--timeout 280/' /etc/systemd/system/painel-falhas.service
            echo "=== Arquivo de servico DEPOIS ==="
            sudo grep -n "ExecStart" /etc/systemd/system/painel-falhas.service
            sudo systemctl daemon-reload
            sudo systemctl restart painel-falhas
            sleep 3
            sudo systemctl status painel-falhas --no-pager | head -10
