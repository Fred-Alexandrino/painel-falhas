name: Diag Chat IA Confirma Fix
on:
  workflow_dispatch: {}
jobs:
  testar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Testar chat-ia
        run: |
          mkdir -p backups
          curl -s -w "\nHTTP_STATUS:%{http_code}\nTIME:%{time_total}s\n" -X POST "https://api.168.138.232.237.sslip.io/chat-ia" \
            -H "Content-Type: application/json" \
            -d '{"pergunta":"quais os principais pontos de atenção de hoje?","historico":[]}' \
            -o backups/diag-confirma-fix.txt
          cat backups/diag-confirma-fix.txt
      - if: always()
        run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-confirma-fix.txt
          git diff --quiet --cached || git commit -m "Diag confirma fix chat-ia [skip ci]"
          git push
