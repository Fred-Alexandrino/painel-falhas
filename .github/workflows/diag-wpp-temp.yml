name: Diag WPP Status Temp
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          curl -s -w "\nSTATUS:%{http_code}\n" --max-time 15 "https://wpp.147.15.66.241.sslip.io/health" -o backups/diag-wpp-health.txt
          curl -s -w "\nSTATUS:%{http_code}\n" --max-time 15 "https://wpp.147.15.66.241.sslip.io/status" -o backups/diag-wpp-status.txt
      - run: |
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git add backups/diag-wpp-health.txt backups/diag-wpp-status.txt
          git commit -m "diag wpp status [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-wpp-health.txt backups/diag-wpp-status.txt
          git commit -m "diag wpp status [skip ci]" || echo "nothing2"
          git push origin HEAD:main
