name: Backfill Subprazos BM (temp)
on:
  workflow_dispatch: {}
jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Backfill e verificar
        run: |
          mkdir -p backups
          curl -s -X POST "https://api.168.138.232.237.sslip.io/compromissos/backfill-subprazos-bm" -o backups/backfill-result.json
          cat backups/backfill-result.json
          echo "---"
          curl -s "https://api.168.138.232.237.sslip.io/compromissos" -o backups/compromissos-com-bm.json
          cat backups/compromissos-com-bm.json
      - if: always()
        run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/backfill-result.json backups/compromissos-com-bm.json
          git diff --quiet --cached || git commit -m "backfill subprazos bm [skip ci]"
          git push
