name: Setar Grupo Hortina Vitesse
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          curl -s -w "\nSTATUS:%{http_code}\n" -X POST "https://api.168.138.232.237.sslip.io/config-set-lote" \
            -H "X-Webhook-Secret: falhas2026" -H "Content-Type: application/json" \
            -d '{"pares":{
              "grupo_usina:Hortina (Quixadá I)":"120363405244065477@g.us",
              "grupo_usina:Vitesse (Quixadá II)":"120363405244065477@g.us"
            }}' > backups/set-hv.txt
          echo "" >> backups/set-hv.txt
          curl -s -w "\nSTATUS:%{http_code}\n" -X POST "https://api.168.138.232.237.sslip.io/config-limpar-cache" -H "X-Webhook-Secret: falhas2026" >> backups/set-hv.txt
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/set-hv.txt
          git commit -m "setar grupo hortina vitesse [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/set-hv.txt
          git commit -m "setar grupo hortina vitesse [skip ci]" || echo "nothing2"
          git push origin HEAD:main
