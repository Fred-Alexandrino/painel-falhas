name: Fetch Fracttal Raw OS Temp
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          WEBHOOK_SECRET: ${{ secrets.FALHAS_WEBHOOK_SECRET }}
        run: |
          mkdir -p backups
          curl -s --max-time 30 -H "X-Webhook-Secret: $WEBHOOK_SECRET" \
            "https://api.168.138.232.237.sslip.io/fracttal-raw?folio=10285" > backups/diag-fracttal-raw-10285.json
      - if: always()
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git add backups/diag-fracttal-raw-10285.json
          git commit -m "diag fracttal raw 10285" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-fracttal-raw-10285.json
          git commit -m "diag fracttal raw 10285" || echo "nothing2"
          git push origin HEAD:main
