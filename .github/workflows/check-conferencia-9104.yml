name: check-conferencia-9104
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Curl endpoint
        run: |
          curl -s -w "\nHTTP:%{http_code}\n" "https://api.168.138.232.237.sslip.io/conferencia-sobreaviso" > result.txt
      - name: Commit result
        run: |
          git config user.name "bot"
          git config user.email "bot@example.com"
          mkdir -p backups
          cp result.txt backups/check-conferencia-result.txt
          git add backups/check-conferencia-result.txt
          git commit -m "check conferencia endpoint result" || echo "nothing to commit"
          git push
