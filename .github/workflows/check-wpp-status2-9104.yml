name: check-wpp-status2-9104
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Curl status
        run: |
          echo "=== WPP /health ===" > result.txt
          curl -s -w "\nHTTP:%{http_code}\n" "https://wpp.147.15.66.241.sslip.io/health" >> result.txt
          echo "=== WPP /status ===" >> result.txt
          curl -s -w "\nHTTP:%{http_code}\n" "https://wpp.147.15.66.241.sslip.io/status" >> result.txt
          echo "=== backend health (se existir) ===" >> result.txt
          curl -s -w "\nHTTP:%{http_code}\n" "https://api.168.138.232.237.sslip.io/health" >> result.txt || true
      - name: Commit result
        run: |
          git config user.name "bot"
          git config user.email "bot@example.com"
          mkdir -p backups
          cp result.txt backups/check-wpp-status2-result.txt
          git add backups/check-wpp-status2-result.txt
          git commit -m "check wpp status2" || echo "nothing to commit"
          git push
