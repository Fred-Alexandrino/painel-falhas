name: Diagnostico VM2 WhatsApp (temp)
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: SSH e salvar output direto no runner
        env:
          SSH_KEY: ${{ secrets.ORACLE_VM2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/vm2_key
          chmod 600 ~/.ssh/vm2_key
          mkdir -p backups
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vm2_key ubuntu@147.15.66.241 '
            echo "=== crontab -l ==="
            crontab -l 2>&1
            echo "=== systemd timers ==="
            systemctl list-timers --all --no-pager
            echo "=== unidades systemd relacionadas a heartbeat/watchdog ==="
            systemctl list-units --all --no-pager | grep -i -E "heartbeat|watchdog|wpp"
            echo "=== conteudo de possiveis scripts de heartbeat ==="
            find / -iname "*heartbeat*" -not -path "*/node_modules/*" 2>/dev/null
            echo "=== journal do systemd mostrando quem chamou restart (unit logs) ==="
            sudo journalctl -u wppconnect --no-pager | grep -i -E "Stopping|Started|Deactivated" | tail -30
            echo "=== journal geral do systemd (nao so a unit) mostrando restart commands ==="
            sudo journalctl --no-pager -n 300 | grep -i wppconnect
          ' > backups/diag-vm2-cron.txt 2>&1 || true
      - name: Commitar resultado
        run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-vm2-cron.txt
          git commit -m "diag vm2 cron [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-vm2-cron.txt
          git commit -m "diag vm2 cron [skip ci]" || echo "nothing2"
          git push origin HEAD:main
