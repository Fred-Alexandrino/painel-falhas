name: Diagnostico VM2 WhatsApp (temp)
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: SSH e salvar output direto no runner
        env:
          SSH_KEY: ${{ secrets.ORACLE_VM2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/vm2_key
          chmod 600 ~/.ssh/vm2_key
          mkdir -p backups
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vm2_key ubuntu@147.15.66.241 '
            echo "=== systemctl status ==="
            sudo systemctl status wppconnect --no-pager -l | head -40
            echo "=== NRestarts ==="
            systemctl show wppconnect -p NRestarts
            echo "=== memoria ==="
            free -h
            echo "=== journalctl ultimas 200 linhas ==="
            sudo journalctl -u wppconnect --no-pager -n 200
          ' > backups/diag-vm2-output.txt 2>&1 || true
      - name: Commitar resultado
        run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-vm2-output.txt
          git commit -m "diag vm2 [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-vm2-output.txt
          git commit -m "diag vm2 [skip ci]" || echo "nothing2"
          git push origin HEAD:main
