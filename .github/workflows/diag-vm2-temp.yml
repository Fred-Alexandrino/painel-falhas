name: Diagnostico VM2 WhatsApp (temp)
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: SSH e salvar output direto no runner
        continue-on-error: true
        env:
          SSH_KEY: ${{ secrets.ORACLE_VM2_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/vm2_key
          chmod 600 ~/.ssh/vm2_key
          mkdir -p backups
          timeout 40 ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i ~/.ssh/vm2_key ubuntu@147.15.66.241 '
            echo "=== crontab -l ==="
            crontab -l 2>&1 </dev/null
            echo "=== systemd timers ==="
            timeout 10 systemctl list-timers --all --no-pager 2>&1
            echo "=== unidades systemd wpp/heartbeat ==="
            timeout 10 systemctl list-units --all --no-pager --plain 2>&1 | grep -i -E "heartbeat|watchdog|wpp"
            echo "=== stop/start no journal da unit ==="
            sudo journalctl -u wppconnect --no-pager 2>&1 | grep -i -E "Stopping|Started wppconnect|Deactivated" | tail -20
          ' > backups/diag-vm2-cron.txt 2>&1
          echo "SSH_EXIT_CODE=$?" >> backups/diag-vm2-cron.txt
      - name: Commitar resultado
        if: always()
        run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-vm2-cron.txt || true
          git commit -m "diag vm2 cron v3 [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-vm2-cron.txt || true
          git commit -m "diag vm2 cron v3 [skip ci]" || echo "nothing2"
          git push origin HEAD:main
