name: Verify Backup Works Temp
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          echo "--- health after token fix ---" > backups/diag-backupcheck.txt
          curl -s -w "\nSTATUS:%{http_code}\n" --max-time 15 "https://wpp.147.15.66.241.sslip.io/health" >> backups/diag-backupcheck.txt
          echo "--- trigger manual backup ---" >> backups/diag-backupcheck.txt
          curl -s -w "\nSTATUS:%{http_code}\n" --max-time 20 -X POST "https://wpp.147.15.66.241.sslip.io/api/backup-auth" >> backups/diag-backupcheck.txt
      - if: always()
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git add backups/diag-backupcheck.txt
          git commit -m "diag backupcheck [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-backupcheck.txt
          git commit -m "diag backupcheck [skip ci]" || echo "nothing2"
          git push origin HEAD:main
