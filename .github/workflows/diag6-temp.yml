name: Diag Config Ler Temp Final
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ler config e limpar cache de novo
        env:
          WEBHOOK_SECRET: ${{ secrets.FALHAS_WEBHOOK_SECRET }}
        run: |
          mkdir -p backups
          curl -s -X POST "https://api.168.138.232.237.sslip.io/config-limpar-cache" \
            -H "X-Webhook-Secret: $WEBHOOK_SECRET" -o backups/diag-limpar-final.json
          curl -s -H "X-Webhook-Secret: $WEBHOOK_SECRET" "https://api.168.138.232.237.sslip.io/config-ler" -o backups/diag-config-final.json
      - if: always()
        run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-limpar-final.json backups/diag-config-final.json
          git diff --quiet --cached || git commit -m "diag config final temp"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-limpar-final.json backups/diag-config-final.json
          git commit -m "diag config final temp" || echo nothing
          git push origin HEAD:main
