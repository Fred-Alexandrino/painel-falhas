name: Check Log Mensagens
on:
  workflow_dispatch: {}
jobs:
  c:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          curl -s -m 30 "https://api.168.138.232.237.sslip.io/outras-usinas-supervisores" -o backups/outras-usinas.json
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/outras-usinas.json
          git diff --quiet --cached || git commit -m "outras usinas [skip ci]"
          git push
