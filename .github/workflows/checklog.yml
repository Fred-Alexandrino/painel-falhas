name: Check Log Mensagens
on:
  workflow_dispatch: {}
jobs:
  c:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          curl -s -m 15 "https://wpp.147.15.66.241.sslip.io/health" -o backups/wpp-health.json
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/wpp-health.json
          git diff --quiet --cached || git commit -m "wpp health [skip ci]"
          git push
