name: Diagnostico Nominatim Direto v2
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_VM1_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 168.138.232.237 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Testar nominatim
        run: |
          mkdir -p backups
          ssh -i ~/.ssh/id_rsa ubuntu@168.138.232.237 '
            curl -s -w "\nHTTP_STATUS:%{http_code}\n" -A "PainelOM-GridCo/1.0 (contato: fred@gridco.com.br)" "https://nominatim.openstreetmap.org/search?q=Rua+Sete+de+Setembro%2C+Boa+Esperanca+do+Sul%2C+SP&format=json&limit=1";
            echo "---SEM USER AGENT CUSTOM---";
            curl -s -w "\nHTTP_STATUS:%{http_code}\n" "https://nominatim.openstreetmap.org/search?q=Rua+Sete+de+Setembro%2C+Boa+Esperanca+do+Sul%2C+SP&format=json&limit=1";
          ' > backups/diag-nominatim.txt 2>&1 || echo "SSH_FALHOU" >> backups/diag-nominatim.txt
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-nominatim.txt
          git commit -m "diag nominatim [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-nominatim.txt
          git commit -m "diag nominatim [skip ci]" || echo "nothing2"
          git push origin HEAD:main
