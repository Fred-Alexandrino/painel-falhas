name: Excluir Atividade 252
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          curl -s -w "\nSTATUS:%{http_code}\n" -X POST "https://api.168.138.232.237.sslip.io/excluir-atividade" -H "Content-Type: application/json" -d "{\"id\":\"252\"}" -o backups/diag-excluir-252.txt
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-excluir-252.txt
          git commit -m "excluir atividade 252 [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-excluir-252.txt
          git commit -m "excluir atividade 252 [skip ci]" || echo "nothing2"
          git push origin HEAD:main
