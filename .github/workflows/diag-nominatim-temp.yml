name: Diagnostico Nominatim Direto
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Testar nominatim direto do VM1 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 168.138.232.237
          username: ubuntu
          key: ${{ secrets.ORACLE_VM1_SSH_KEY }}
          script: |
            echo "=== teste direto Nominatim a partir do VM1 ==="
            curl -s -w "\nHTTP_STATUS:%{http_code}\n" -A "PainelOM-GridCo/1.0 (contato: fred@gridco.com.br)" "https://nominatim.openstreetmap.org/search?q=Rua+Sete+de+Setembro%2C+Boa+Esperanca+do+Sul%2C+SP&format=json&limit=1"
