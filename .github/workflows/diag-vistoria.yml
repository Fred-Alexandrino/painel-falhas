name: Diag Vistoria Colaboradores
on:
  workflow_dispatch: {}
jobs:
  ler:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      WEBHOOK_SECRET: ${{ secrets.FALHAS_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Ler atividades e config
        run: |
          mkdir -p backups
          curl -s "https://api.168.138.232.237.sslip.io/atividades" -o backups/diag-atividades.json
          curl -s -H "X-Webhook-Secret: $WEBHOOK_SECRET" "https://api.168.138.232.237.sslip.io/config-ler" -o backups/diag-config-sistema.json
          echo "--- atividades (tamanho) ---"
          wc -c backups/diag-atividades.json
          echo "--- config (tamanho) ---"
          wc -c backups/diag-config-sistema.json
      - if: always()
        run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-atividades.json backups/diag-config-sistema.json
          git diff --quiet --cached || git commit -m "Diag vistoria colaboradores [skip ci]"
          git push
