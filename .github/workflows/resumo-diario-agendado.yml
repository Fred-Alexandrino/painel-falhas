name: Resumo Diario Agendado (17h) - DESATIVADO, ver piggyback em /sync-fracttal
on:
  workflow_dispatch: {}
jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar e enviar resumo diario manualmente
        env:
          WEBHOOK_SECRET: ${{ secrets.FALHAS_WEBHOOK_SECRET }}
        run: |
          curl -s -m 55 -X POST "https://api.168.138.232.237.sslip.io/gerar-resumo-diario" -H "X-Webhook-Secret: $WEBHOOK_SECRET"
