name: Diag GH Token VM2 Temp
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: SSH inspect env/service config
        env:
          SSH_KEY: ${{ secrets.ORACLE_VM2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/vm2_key
          chmod 600 ~/.ssh/vm2_key
          mkdir -p backups
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vm2_key ubuntu@147.15.66.241 '
            echo "=== systemd service file ==="
            sudo cat /etc/systemd/system/wppconnect.service
            echo "=== .env file (if exists), token masked ==="
            if [ -f ~/wppconnect-server/.env ]; then
              sed -E "s/(GITHUB_TOKEN=).{6}.*/\1***MASKED***/" ~/wppconnect-server/.env
            else
              echo "sem .env"
            fi
            echo "=== env vars visible to running process (masked) ==="
            sudo cat /proc/$(pgrep -f server.js | head -1)/environ 2>/dev/null | tr "\0" "\n" | grep -i "GITHUB\|BACKUP" | sed -E "s/(TOKEN=).{6}.*/\1***MASKED***/"
          ' > backups/diag-ghtoken.txt 2>&1
          cat backups/diag-ghtoken.txt
      - if: always()
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git add backups/diag-ghtoken.txt
          git commit -m "diag ghtoken [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-ghtoken.txt
          git commit -m "diag ghtoken [skip ci]" || echo "nothing2"
          git push origin HEAD:main
