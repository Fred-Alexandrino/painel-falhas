name: diag-vm2-logs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get VM2 service status and logs
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 147.15.66.241
          username: ubuntu
          key: ${{ secrets.ORACLE_VM2_SSH_KEY }}
          script_stop: false
          script: |
            echo "=== systemctl status ===" > /tmp/vm2diag.txt
            sudo systemctl status wppconnect --no-pager -l >> /tmp/vm2diag.txt 2>&1
            echo "" >> /tmp/vm2diag.txt
            echo "=== last 150 lines journalctl ===" >> /tmp/vm2diag.txt
            sudo journalctl -u wppconnect -n 150 --no-pager >> /tmp/vm2diag.txt 2>&1
            cat /tmp/vm2diag.txt
      - name: Capture output via SSH again and push
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 147.15.66.241
          username: ubuntu
          key: ${{ secrets.ORACLE_VM2_SSH_KEY }}
          script: cat /tmp/vm2diag.txt
        id: sshlog
      - name: Push result via API
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${{ steps.sshlog.outputs.stdout }}" > result.txt
          CONTENT_B64=$(base64 -w0 result.txt)
          EXISTING_SHA=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/Fred-Alexandrino/painel-falhas/contents/backups/vm2-logs.txt" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('sha',''))")
          if [ -n "$EXISTING_SHA" ]; then
            PAYLOAD="{\"message\":\"diag: vm2 logs\",\"content\":\"$CONTENT_B64\",\"sha\":\"$EXISTING_SHA\"}"
          else
            PAYLOAD="{\"message\":\"diag: vm2 logs\",\"content\":\"$CONTENT_B64\"}"
          fi
          echo "$PAYLOAD" > /tmp/payload.json
          curl -s -X PUT -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Fred-Alexandrino/painel-falhas/contents/backups/vm2-logs.txt" \
            -d @/tmp/payload.json -w "\nHTTP:%{http_code}\n"
