name: Diagnostico Nominatim Python
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_VM1_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 168.138.232.237 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Testar nominatim via python requests (igual ao app.py)
        run: |
          mkdir -p backups
          ssh -i ~/.ssh/id_rsa ubuntu@168.138.232.237 '
            cd ~/painel-falhas
            venv/bin/python3 -c "
import requests
enderecos = [\"Projeto Xavantina, Setor Nova Brasília, Gleba B, Nova Xavantina – MT, CEP: 78690-000\", \"Estrada de Santa Luzia, Colíder - MT, 78500-000\", \"Fazenda Lavrinha, S/N, Nobres - MT, 78470-000\"]
for endereco in enderecos:
    resp = requests.get(\"https://nominatim.openstreetmap.org/search\", params={\"q\": endereco + \", Brasil\", \"format\": \"json\", \"limit\": 1}, headers={\"User-Agent\": \"PainelOM-GridCo/1.0 (contato: fred@gridco.com.br)\", \"Accept-Language\": \"pt-BR\"}, timeout=10)
    print(\"STATUS:\", resp.status_code)
    print(\"BODY:\", resp.text[:500])
    print(\"---\")
"
          ' > backups/diag-nominatim-py.txt 2>&1 || echo "SSH_FALHOU" >> backups/diag-nominatim-py.txt
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-nominatim-py.txt
          git commit -m "diag nominatim py [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-nominatim-py.txt
          git commit -m "diag nominatim py [skip ci]" || echo "nothing2"
          git push origin HEAD:main
