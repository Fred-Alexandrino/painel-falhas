name: check-cedro-9104
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Curl endpoint
        run: |
          curl -s "https://api.168.138.232.237.sslip.io/gerar-comunicado-sobreaviso" | python3 -c "
import json,sys
d = json.load(sys.stdin)
for g in d['grupos']:
    if 'Cedro' in g['nome']:
        print(json.dumps(g['usinas'], ensure_ascii=False, indent=2))
" > result.txt
      - name: Commit result
        run: |
          git config user.name "bot"
          git config user.email "bot@example.com"
          mkdir -p backups
          cp result.txt backups/check-cedro-result.txt
          git add backups/check-cedro-result.txt
          git commit -m "check cedro result" || echo "nothing to commit"
          git push
