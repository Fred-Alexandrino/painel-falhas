name: diag-test-resumo-chamados
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: test endpoint
        run: |
          curl -s -X POST https://api.168.138.232.237.sslip.io/gerar-resumo-chamados-cliente \
            -H "Content-Type: application/json" \
            -d '{"cliente":"Renogrid","chamados":[{"usina":"Nova Xavantina 1","status":"Aguardando retorno do Fabricante","ticket":"6941935","equipamento":"Inversor 14","ativo":"Inversor"},{"usina":"Nobres 1","status":"Em análise","ticket":"6797320","equipamento":"Tracker 5","ativo":"Tracker"}]}' \
            -o /tmp/resp.json -w "HTTP:%{http_code}\n"
          cat /tmp/resp.json
      - uses: actions/upload-artifact@v4
        with:
          name: resp
          path: /tmp/resp.json
