name: Diag Prova Sync Status 4

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Buscar status do ultimo ciclo
        env:
          WEBHOOK_SECRET: ${{ secrets.FALHAS_WEBHOOK_SECRET }}
        run: |
          mkdir -p backups
          curl -s "https://api.168.138.232.237.sslip.io/sync-fracttal-status" -H "X-Webhook-Secret: $WEBHOOK_SECRET" -o backups/prova-status2.json
          cat backups/prova-status2.json
      - name: Salvar resultado
        if: always()
        run: |
          git pull --rebase origin main || true
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git add backups/prova-status2.json
          git diff --quiet --cached || git commit -m "Prova status 4 [skip ci]"
          git push || (git pull --rebase origin main && git push)
