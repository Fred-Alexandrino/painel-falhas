name: create-fv-monitor3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create monitor
        run: |
          echo "" | base64 -d > create_monitor3.py
          mkdir -p backups
          python3 create_monitor3.py > backups/monitor-create3-result.txt 2>&1 || true
          cat backups/monitor-create3-result.txt
      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Fred-Alexandrino/painel-falhas.git
          git add backups/monitor-create3-result.txt
          git commit -m "chore: create fv monitor v3" || echo "nothing"
          git push origin HEAD:main
