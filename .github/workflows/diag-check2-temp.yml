name: Diagnostico Final Verificacao 2
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          curl -s -w "\nSTATUS:%{http_code}\n" --max-time 20 "https://api.168.138.232.237.sslip.io/localizacoes" -o backups/check-loc.txt
          curl -s -w "\nSTATUS:%{http_code}\n" --max-time 20 "https://api.168.138.232.237.sslip.io/health" -o backups/check-health.txt
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/check-loc.txt backups/check-health.txt
          git commit -m "check final [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/check-loc.txt backups/check-health.txt
          git commit -m "check final [skip ci]" || echo "nothing2"
          git push origin HEAD:main
