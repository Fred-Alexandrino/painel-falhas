name: diag-test-async
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test async sync-fracttal
        run: |
          echo "" | base64 -d > test_async.py
          mkdir -p backups
          python3 test_async.py > backups/async-test.txt 2>&1 || true
          cat backups/async-test.txt
      - name: Push
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Fred-Alexandrino/painel-falhas.git
          git add backups/async-test.txt || true
          git commit -m "diag: async test" || echo "nothing"
          git push origin HEAD:main || true
