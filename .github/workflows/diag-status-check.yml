name: diag-status-check
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check uptime logs
        run: |
          echo "" | base64 -d > check.py
          mkdir -p backups
          python3 check.py > backups/status-check.txt 2>&1 || true
          cat backups/status-check.txt
      - name: Push
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Fred-Alexandrino/painel-falhas.git
          git add backups/status-check.txt || true
          git commit -m "diag: uptime logs" || echo "nothing"
          git push origin HEAD:main || true
