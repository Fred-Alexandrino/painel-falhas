name: Diag Chat IA Erro
on:
  workflow_dispatch: {}
jobs:
  testar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Testar chat-ia
        run: |
          mkdir -p backups
          curl -s -X POST "https://api.168.138.232.237.sslip.io/chat-ia" \
            -H "Content-Type: application/json" \
            -d '{"pergunta":"quais os principais pontos de atenção de hoje?","historico":[]}' \
            -o backups/diag-chat-ia-erro.json
          cat backups/diag-chat-ia-erro.json
      - if: always()
        run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/diag-chat-ia-erro.json
          git diff --quiet --cached || git commit -m "Diag chat-ia erro [skip ci]"
          git push
