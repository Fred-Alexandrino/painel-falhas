name: Diag VM1 (somente leitura)
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.0
        with:
          host: 168.138.232.237
          username: ubuntu
          key: ${{ secrets.ORACLE_VM1_SSH_KEY }}
          command_timeout: 5m
          script: |
            echo "== caddy"; systemctl is-active caddy; ls /var/log/caddy/ 2>/dev/null
            echo "== erros caddy 13:00-13:35 UTC"; sudo journalctl -u caddy --since "2026-11-16 13:00" --until "2026-11-16 13:40" --no-pager | grep -iE "error|abort|timeout|refused|EOF|reset" | cut -c1-260 | tail -40
            echo "== acessos Android 13:10-13:35 (se houver log de acesso)"
            for f in /var/log/caddy/*.log; do sudo grep -h "Android" "$f" 2>/dev/null | grep -E "2026-11-16T13:(1|2|3)|\"ts\":179483" | tail -5 | cut -c1-300; done
            echo "== gunicorn 13:10-13:35"; sudo journalctl -u painel-falhas --since "2026-11-16 13:10" --until "2026-11-16 13:40" --no-pager | grep -E "WORKER TIMEOUT|Booting|exiting|Traceback|Error" | tail -20
            echo "== caddyfile"; sudo cat /etc/caddy/Caddyfile 2>/dev/null | head -30
