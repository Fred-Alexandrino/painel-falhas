name: Vincular Grupo Camila RN (temporario)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vincular:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vincular grupo as 6 usinas
        run: |
          set -e
          mkdir -p backups
          GRUPO="120363423651075316@g.us"
          USINAS=(
            "Thopen - Rodrigues 1 - RN"
            "Thopen - Parelhas 1 - RN"
            "Thopen - Caicó - RN"
            "Thopen - Rodrigues 2 - RN"
            "Thopen - Senador Elói 1 - RN"
            "Thopen - Jucurutu 1 - RN"
          )
          > backups/resultado-vincular-grupo.json
          for U in "${USINAS[@]}"; do
            echo "=== $U ==="
            curl -sS -X POST "https://api.168.138.232.237.sslip.io/supervisao-temporaria/adicionar" \
              -H "Content-Type: application/json" \
              --data-binary @<(python3 -c "
import json
print(json.dumps({'cliente':'Thopen','usina':'''$U''','cluster':'RN Sul 01','responsavelOriginal':'Camila Viana','grupoId':'$GRUPO'}))
") >> backups/resultado-vincular-grupo.json
            echo "" >> backups/resultado-vincular-grupo.json
            sleep 10
          done
          cat backups/resultado-vincular-grupo.json

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/resultado-vincular-grupo.json
          git commit -m "Teste temporario: vincular grupo Camila as usinas RN" || echo "Nada para commitar"
          git push
