name: Diag WPP Timeout Temp
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          echo "--- VM1 health ---" > backups/diag-wpp.txt
          curl -s -w "\nSTATUS:%{http_code} TIME:%{time_total}\n" --max-time 15 "https://api.168.138.232.237.sslip.io/health" >> backups/diag-wpp.txt
          echo "--- VM2 (wpp) health ---" >> backups/diag-wpp.txt
          curl -s -w "\nSTATUS:%{http_code} TIME:%{time_total}\n" --max-time 15 "https://wpp.147.15.66.241.sslip.io/health" >> backups/diag-wpp.txt
          echo "--- VM2 root ---" >> backups/diag-wpp.txt
          curl -s -w "\nSTATUS:%{http_code} TIME:%{time_total}\n" --max-time 25 "https://wpp.147.15.66.241.sslip.io/" >> backups/diag-wpp.txt
          echo "--- VM2 test send (invalid group, expect fast error not timeout) ---" >> backups/diag-wpp.txt
          curl -s -w "\nSTATUS:%{http_code} TIME:%{time_total}\n" --max-time 25 -X POST -H "Content-Type: application/json" -H "X-Webhook-Secret: ${{ secrets.FALHAS_WEBHOOK_SECRET }}" \
            -d '{"grupoId":"__diag_invalido__@g.us","texto":"teste diagnostico - pode ignorar"}' \
            "https://wpp.147.15.66.241.sslip.io/api/enviar-mensagem" >> backups/diag-wpp.txt
      - run: |
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git add backups/diag-wpp.txt
          git commit -m "diag wpp timeout [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/diag-wpp.txt
          git commit -m "diag wpp timeout [skip ci]" || echo "nothing2"
          git push origin HEAD:main
