name: check-vm2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check baileys version on VM2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 147.15.66.241
          username: ubuntu
          key: ${{ secrets.ORACLE_VM2_SSH_KEY }}
          script: |
            cd ~/wppconnect-server
            cat node_modules/@whiskeysockets/baileys/package.json | grep '"version"'
            node --version
