name: check-vm2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check history
        run: |
          echo "" | base64 -d > check.py
          mkdir -p backups
          python3 check.py > backups/vm2-check.txt 2>&1 || true
          cat backups/vm2-check.txt
      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Fred-Alexandrino/painel-falhas.git
          git add backups/vm2-check.txt
          git commit -m "check: history today" || echo "nothing"
          git push origin HEAD:main
