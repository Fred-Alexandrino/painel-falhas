name: test-sv
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          echo "" | base64 -d > test_status_vigia.py
          mkdir -p backups
          python3 test_status_vigia.py > backups/sv-result.txt 2>&1 || true
          cat backups/sv-result.txt
      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Fred-Alexandrino/painel-falhas.git
          git add backups/sv-result.txt
          git commit -m "test: status apos vigia" || echo "nothing"
          git push origin HEAD:main
