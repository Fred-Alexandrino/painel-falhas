name: Checar Total Localizacoes Final
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p backups
          curl -s --max-time 20 "https://api.168.138.232.237.sslip.io/localizacoes" -o /tmp/loc.json
          printf '%s\n' \
            "import json" \
            "d = json.load(open('/tmp/loc.json'))" \
            "itens = d['itens']" \
            "com = [i for i in itens if i['lat'] is not None]" \
            "sem = [i for i in itens if i['lat'] is None]" \
            "print('total:', len(itens))" \
            "print('com coordenada:', len(com))" \
            "print('sem coordenada:', [i['usina'] for i in sem])" \
            > /tmp/chk.py
          python3 /tmp/chk.py > backups/final-check-loc.txt 2>&1
      - run: |
          git config user.name "sync-fracttal-bot"
          git config user.email "actions@github.com"
          git add backups/final-check-loc.txt
          git commit -m "final check loc [skip ci]" || echo "nothing"
          git fetch origin main
          git reset --soft origin/main
          git add backups/final-check-loc.txt
          git commit -m "final check loc [skip ci]" || echo "nothing2"
          git push origin HEAD:main
