<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sobreaviso Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap">
<style>*{box-sizing:border-box}
:root{
  --ground:#F3F3F7; --surface:#FFFFFF; --surface-2:#FAFAFB; --panel:#191528;
  --ink:#191528; --ink-2:#504C63; --ink-3:#7E7A93;
  --line:#DEDEE6; --line-2:#C6C4D3;
  --accent:#A9DB21; --accent-ink:#191528; --accent-soft:#EDF6D0;
  --ok:#2E7D32; --ok-soft:#E6F1E7; --warn:#B9770E; --warn-soft:#FAEFDB;
  --risk:#B3261E; --risk-soft:#FAE5E3;
  --shadow:0 1px 2px rgba(25,21,40,.06),0 8px 24px rgba(25,21,40,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#100E1C; --surface:#1A1730; --surface-2:#211D3A; --panel:#0B0916;
    --ink:#F3F2F8; --ink-2:#B5B1C9; --ink-3:#8A86A4;
    --line:#322D4C; --line-2:#443E64;
    --accent:#B7E63A; --accent-ink:#12100E; --accent-soft:#2A3312;
    --ok:#7FC98A; --ok-soft:#1B2E20; --warn:#E5A94A; --warn-soft:#33280F;
    --risk:#F0918A; --risk-soft:#361A19;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#100E1C; --surface:#1A1730; --surface-2:#211D3A; --panel:#0B0916;
  --ink:#F3F2F8; --ink-2:#B5B1C9; --ink-3:#8A86A4;
  --line:#322D4C; --line-2:#443E64;
  --accent:#B7E63A; --accent-ink:#12100E; --accent-soft:#2A3312;
  --ok:#7FC98A; --ok-soft:#1B2E20; --warn:#E5A94A; --warn-soft:#33280F;
  --risk:#F0918A; --risk-soft:#361A19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
/* ---------- marca d'água Grid (mesmo tratamento dos BMs) ---------- */
#marcaAgua{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  width:430px;max-width:74vw;z-index:0;pointer-events:none;opacity:.9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #marcaAgua{opacity:.18}}
:root[data-theme="dark"] #marcaAgua{opacity:.18}
#app{position:relative;z-index:1}
.emblema{position:absolute;right:-46px;top:50%;transform:translateY(-50%);
  width:250px;opacity:.30;pointer-events:none;z-index:0}
@media print{
  #marcaAgua{display:block!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;width:110mm}
  .acts,.tabs{display:none!important}
  .card,.now{box-shadow:none}
}

body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:Calibri,Carlito,"Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 72px}
a{color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}

/* ---------- cabeçalho ---------- */
.top{background:var(--panel);color:#fff;border-bottom:3px solid var(--accent);position:relative;overflow:hidden}
.top-in{max-width:1240px;margin:0 auto;padding:18px 20px 16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:16px}
.brand img.logo{width:132px;display:block;flex:none}
.rule{width:1px;align-self:stretch;background:#4A4560;min-height:34px}
.brand h1{font-size:20px;font-weight:700;letter-spacing:.2px;line-height:1.15}
.brand p{margin:2px 0 0;font-size:12px;color:#B7B3C8;letter-spacing:.6px;text-transform:uppercase}
.acts{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
button{font:inherit;cursor:pointer;border-radius:4px;border:1px solid transparent;padding:7px 14px;transition:.12s}
button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:transparent;color:#fff;border-color:#4A4560}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-key{background:var(--accent);color:#191528;font-weight:700;border-color:var(--accent)}
.btn-key:hover{filter:brightness(1.08)}
.btn-key[disabled]{background:transparent;color:#6F6A87;border-color:#3B3653;font-weight:400;cursor:default;filter:none}

/* ---------- plantão agora ---------- */
.now{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;background:var(--line);
     border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:22px 0 26px;box-shadow:var(--shadow)}
.now>div{background:var(--surface);padding:14px 16px}
.now .lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.now .big{font-size:19px;font-weight:700;line-height:1.25}
.now .sub{font-size:13px;color:var(--ink-2);margin-top:3px}
.now .live{border-left:4px solid var(--accent)}

/* ---------- abas ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--ink-2);padding:9px 14px;white-space:nowrap;border-radius:0}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.tab .n{font-size:11px;color:var(--ink-3);margin-left:5px}

/* ---------- tabelas ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.card+.card{margin-top:18px}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.card-h h2{font-size:15px;font-weight:700}
.card-h p{margin:0;font-size:13px;color:var(--ink-2)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{background:var(--panel);color:#fff;font-weight:700;text-align:left;padding:9px 12px;font-size:12px;
   letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;position:sticky;top:0;z-index:2}
td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even) td{background:var(--surface-2)}
tbody tr.is-now td{background:var(--accent-soft)}
tbody tr:hover td{background:var(--surface-2);filter:brightness(.99)}
td.num{color:var(--ink-2);white-space:nowrap}
.mono{font-variant-numeric:tabular-nums}

/* ---------- pílulas ---------- */
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-risk{background:var(--risk-soft);color:var(--risk)}
.p-hol{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.p-mute{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}

select{font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);
       border-radius:4px;padding:4px 6px;max-width:100%}
select:hover{border-color:var(--accent)}
select.dirty{border-color:var(--accent);background:var(--accent-soft)}

/* ---------- métricas ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:1px;background:var(--line)}
.kpi{background:var(--surface);padding:14px 16px}
.kpi .lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3)}
.kpi .v{font-size:26px;font-weight:700;line-height:1.15;margin-top:3px}
.kpi .d{font-size:12.5px;color:var(--ink-2)}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent)}

.note{padding:13px 16px;font-size:13.5px;color:var(--ink-2);border-top:1px solid var(--line);background:var(--surface-2)}
.note b{color:var(--ink)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.ctl label{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-3)}
.nav{background:var(--surface);border:1px solid var(--line-2);color:var(--ink);padding:4px 11px;font-weight:700}
.nav:hover{border-color:var(--accent)}
.blk{font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel);color:#fff;
  padding:10px 18px;border-radius:4px;border-left:3px solid var(--accent);box-shadow:var(--shadow);z-index:50;font-size:14px}
.foot{margin-top:26px;font-size:12.5px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:12px}
.foot i{font-style:italic}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:640px){.brand h1{font-size:18px}.now .big{font-size:17px}}

/* ---------- calendário mensal ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
.cal .wd{background:var(--surface-2);padding:7px 8px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;
  color:var(--ink-3);text-align:center;font-weight:700}
.cal .dia{background:var(--surface);min-height:96px;max-height:300px;overflow-y:auto;padding:7px 8px;position:relative}
.cal .dia.fora{background:var(--surface-2);opacity:.45}
.cal .dia .n{font-size:13px;font-weight:700;color:var(--ink-3)}
.cal .dia.on{background:var(--accent-soft)}
.cal .dia.hol{background:var(--warn-soft)}
.cal .dia.hoje{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .dia.on .n,.cal .dia.hol .n{color:var(--ink)}
.cal .quem{margin-top:5px;font-size:12px;line-height:1.35;color:var(--ink)}
.cal .quem b{display:block;font-weight:700}
.cal .fer{margin-top:4px;font-size:11px;color:var(--warn);font-weight:700}
.cal .tel{font-size:11px;color:var(--ink-2);white-space:nowrap}
.legenda{display:flex;gap:16px;flex-wrap:wrap;padding:10px 16px;font-size:12.5px;color:var(--ink-2);
  border-top:1px solid var(--line);background:var(--surface-2)}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
@media (max-width:720px){
  .cal{grid-template-columns:repeat(7,minmax(88px,1fr));overflow-x:auto}
  .cal .dia{min-height:74px}
}

/* ---------- chips de seleção de equipe ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.chip{background:var(--surface);border:1px solid var(--line-2);color:var(--ink-2);border-radius:999px;
  padding:4px 11px;font-size:12.5px;cursor:pointer;font-family:inherit;line-height:1.5}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:700}
.chip .c{color:var(--ink-3);font-weight:400;margin-left:4px}
.chip[aria-pressed="true"] .c{color:var(--ink-2)}
.chips .lbl{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-3);
  align-self:center;margin-right:2px}
.chip-lim{border-style:dashed}

.dia.sem-pessoa{opacity:.34}
select.esc-tec{font:inherit;font-weight:700;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:2px 4px;max-width:190px}
select.esc-tec.fora{border-color:var(--risk);color:var(--risk)}
select.esc-tec.dirty{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

#gTxt,#uTxt{font:inherit;padding:5px 9px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);color:var(--ink);min-width:190px}
#gTxt:focus,#uTxt:focus{outline:2px solid var(--accent);outline-offset:1px}

.tt{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3)}
</style>
</head>

/* ---------- marca d'água Grid (mesmo tratamento dos BMs) ---------- */
#marcaAgua{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  width:430px;max-width:74vw;z-index:0;pointer-events:none;opacity:.9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #marcaAgua{opacity:.18}}
:root[data-theme="dark"] #marcaAgua{opacity:.18}
#app{position:relative;z-index:1}
.emblema{position:absolute;right:-46px;top:50%;transform:translateY(-50%);
  width:250px;opacity:.30;pointer-events:none;z-index:0}
@media print{
  #marcaAgua{display:block!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;width:110mm}
  .acts,.tabs{display:none!important}
  .card,.now{box-shadow:none}
}

body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:Calibri,Carlito,"Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 72px}
a{color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}

/* ---------- cabeçalho ---------- */
.top{background:var(--panel);color:#fff;border-bottom:3px solid var(--accent);position:relative;overflow:hidden}
.top-in{max-width:1240px;margin:0 auto;padding:18px 20px 16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:16px}
.brand img.logo{width:132px;display:block;flex:none}
.rule{width:1px;align-self:stretch;background:#4A4560;min-height:34px}
.brand h1{font-size:20px;font-weight:700;letter-spacing:.2px;line-height:1.15}
.brand p{margin:2px 0 0;font-size:12px;color:#B7B3C8;letter-spacing:.6px;text-transform:uppercase}
.acts{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
button{font:inherit;cursor:pointer;border-radius:4px;border:1px solid transparent;padding:7px 14px;transition:.12s}
button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:transparent;color:#fff;border-color:#4A4560}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-key{background:var(--accent);color:#191528;font-weight:700;border-color:var(--accent)}
.btn-key:hover{filter:brightness(1.08)}
.btn-key[disabled]{background:transparent;color:#6F6A87;border-color:#3B3653;font-weight:400;cursor:default;filter:none}

/* ---------- plantão agora ---------- */
.now{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;background:var(--line);
     border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:22px 0 26px;box-shadow:var(--shadow)}
.now>div{background:var(--surface);padding:14px 16px}
.now .lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.now .big{font-size:19px;font-weight:700;line-height:1.25}
.now .sub{font-size:13px;color:var(--ink-2);margin-top:3px}
.now .live{border-left:4px solid var(--accent)}

/* ---------- abas ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--ink-2);padding:9px 14px;white-space:nowrap;border-radius:0}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.tab .n{font-size:11px;color:var(--ink-3);margin-left:5px}

/* ---------- tabelas ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.card+.card{margin-top:18px}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.card-h h2{font-size:15px;font-weight:700}
.card-h p{margin:0;font-size:13px;color:var(--ink-2)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{background:var(--panel);color:#fff;font-weight:700;text-align:left;padding:9px 12px;font-size:12px;
   letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;position:sticky;top:0;z-index:2}
td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even) td{background:var(--surface-2)}
tbody tr.is-now td{background:var(--accent-soft)}
tbody tr:hover td{background:var(--surface-2);filter:brightness(.99)}
td.num{color:var(--ink-2);white-space:nowrap}
.mono{font-variant-numeric:tabular-nums}

/* ---------- pílulas ---------- */
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-risk{background:var(--risk-soft);color:var(--risk)}
.p-hol{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.p-mute{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}

select{font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);
       border-radius:4px;padding:4px 6px;max-width:100%}
select:hover{border-color:var(--accent)}
select.dirty{border-color:var(--accent);background:var(--accent-soft)}

/* ---------- métricas ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:1px;background:var(--line)}
.kpi{background:var(--surface);padding:14px 16px}
.kpi .lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3)}
.kpi .v{font-size:26px;font-weight:700;line-height:1.15;margin-top:3px}
.kpi .d{font-size:12.5px;color:var(--ink-2)}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent)}

.note{padding:13px 16px;font-size:13.5px;color:var(--ink-2);border-top:1px solid var(--line);background:var(--surface-2)}
.note b{color:var(--ink)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.ctl label{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-3)}
.nav{background:var(--surface);border:1px solid var(--line-2);color:var(--ink);padding:4px 11px;font-weight:700}
.nav:hover{border-color:var(--accent)}
.blk{font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel);color:#fff;
  padding:10px 18px;border-radius:4px;border-left:3px solid var(--accent);box-shadow:var(--shadow);z-index:50;font-size:14px}
.foot{margin-top:26px;font-size:12.5px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:12px}
.foot i{font-style:italic}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:640px){.brand h1{font-size:18px}.now .big{font-size:17px}}

/* ---------- calendário mensal ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
.cal .wd{background:var(--surface-2);padding:7px 8px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;
  color:var(--ink-3);text-align:center;font-weight:700}
.cal .dia{background:var(--surface);min-height:96px;max-height:300px;overflow-y:auto;padding:7px 8px;position:relative}
.cal .dia.fora{background:var(--surface-2);opacity:.45}
.cal .dia .n{font-size:13px;font-weight:700;color:var(--ink-3)}
.cal .dia.on{background:var(--accent-soft)}
.cal .dia.hol{background:var(--warn-soft)}
.cal .dia.hoje{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .dia.on .n,.cal .dia.hol .n{color:var(--ink)}
.cal .quem{margin-top:5px;font-size:12px;line-height:1.35;color:var(--ink)}
.cal .quem b{display:block;font-weight:700}
.cal .fer{margin-top:4px;font-size:11px;color:var(--warn);font-weight:700}
.cal .tel{font-size:11px;color:var(--ink-2);white-space:nowrap}
.legenda{display:flex;gap:16px;flex-wrap:wrap;padding:10px 16px;font-size:12.5px;color:var(--ink-2);
  border-top:1px solid var(--line);background:var(--surface-2)}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
@media (max-width:720px){
  .cal{grid-template-columns:repeat(7,minmax(88px,1fr));overflow-x:auto}
  .cal .dia{min-height:74px}
}

/* ---------- chips de seleção de equipe ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.chip{background:var(--surface);border:1px solid var(--line-2);color:var(--ink-2);border-radius:999px;
  padding:4px 11px;font-size:12.5px;cursor:pointer;font-family:inherit;line-height:1.5}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:700}
.chip .c{color:var(--ink-3);font-weight:400;margin-left:4px}
.chip[aria-pressed="true"] .c{color:var(--ink-2)}
.chips .lbl{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-3);
  align-self:center;margin-right:2px}
.chip-lim{border-style:dashed}

.dia.sem-pessoa{opacity:.34}
select.esc-tec{font:inherit;font-weight:700;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:2px 4px;max-width:190px}
select.esc-tec.fora{border-color:var(--risk);color:var(--risk)}
select.esc-tec.dirty{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

#gTxt,#uTxt{font:inherit;padding:5px 9px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);color:var(--ink);min-width:190px}
#gTxt:focus,#uTxt:focus{outline:2px solid var(--accent);outline-offset:1px}

.tt{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3)}
</style>
</head>

o":true},"Matões/MA":{"ufvs":["Matões 100","Matões 200"],"resp":"Denilson","empresa":"","tel":"(99) 99203-3855","status":"Ativo","completo":false,"tel_original":"(99) 9203-3855","nono_digito":true},"Linhares/ES":{"ufvs":["Linhares 1"],"resp":"Carlos","empresa":"","tel":"(27) 99702-1993","status":"Ativo","completo":true},"Coração 1 e 2/SC":{"ufvs":["Coração 1 e 2"],"resp":"Cláudio Luiz","empresa":"","tel":"(49) 99108-8080","status":"Ativo","completo":false,"tel_original":"(49) 9108-8080","nono_digito":true},"Sarandi (Marialva/PR)":{"ufvs":["Sarandi (Marialva)"],"resp":"Daniel","empresa":"","tel":"(44) 99874-2396","status":"Ativo","completo":false,"tel_original":"(44) 9874-2396","nono_digito":true}},"nono_digito":["Cláudio Luiz","Daniel","Daniel de Paula","Denilson","Erick","Gabriel","Pablo","Walter"],"suspeitos":["o número do Walter difere do da Danuth Fernandes em um único dígito ((85) 99926-0242 contra 99926-0342) — pode ser erro de digitação na base; conferir antes de confiar"]}}<\/script>
<script>(function () {
  "use strict";
  var RAW = document.getElementById("tpl").textContent;
  var TPL = RAW.replace(/<\\\/script>/g, "<" + "/script>");
  var E = JSON.parse(document.getElementById("estado").textContent);
  var app = document.getElementById("app");
  var dirty = false, aba = "sup", iBloco = 0, filtroSup = "todos", pub = null, podeSalvar = true;
  var mesSel = null, supSel = "todos", eqsSel = [], pessoaSel = "todos";
  var gSup = "todos", gPes = "todos", gSit = "todos", gTxt = "";   // filtros da aba rodízio
  var uTxt = "";                                                   // busca da aba usinas
  var editados = {};   // "grupo:bloco:posicao" das trocas manuais, para o destaque sobreviver ao re-render   // equipes marcadas; vazio = todas as visíveis

  var MES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  var DIA = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];

  function d(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function curto(s) { var x = d(s); return ("0" + x.getDate()).slice(-2) + "/" + ("0" + (x.getMonth() + 1)).slice(-2); }
  function longo(s) { var x = d(s); return DIA[x.getDay()] + " " + x.getDate() + " " + MES[x.getMonth()]; }
  function faixa(b) { return b.inicio === b.fim ? curto(b.inicio) : curto(b.inicio) + " a " + curto(b.fim); }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

  // ---------- bloco vigente ----------
  function indiceAgora() {
    var hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    for (var i = 0; i < E.blocos.length; i++) {
      var b = E.blocos[i];
      if (hoje >= d(b.inicio) && hoje <= d(b.fim)) return { i: i, vivo: true };
    }
    for (var j = 0; j < E.blocos.length; j++) if (d(E.blocos[j].inicio) > hoje) return { i: j, vivo: false };
    return { i: E.blocos.length - 1, vivo: false };
  }

  // ---------- conformidade ----------
  function conformidade() {
    var c = {}, gr = {}, fe = {}, i, k;
    E.supervisores.forEach(function (p) { c[p] = 0; gr[p] = 0; fe[p] = 0; });
    var idx = {}; E.supervisores.forEach(function (p) { idx[p] = []; });
    E.blocos.forEach(function (b, i) {
      b.supervisores.forEach(function (p) {
        if (c[p] === undefined) { c[p] = 0; gr[p] = 0; fe[p] = 0; idx[p] = []; }
        c[p]++; idx[p].push(i);
        if (b.peso === "grande") gr[p]++;
        if (b.feriado) fe[p]++;
      });
    });
    var vals = Object.keys(c).map(function (k) { return c[k]; });
    var grv = Object.keys(gr).map(function (k) { return gr[k]; });
    var seguidos = [];
    Object.keys(idx).forEach(function (p) {
      for (var i = 1; i < idx[p].length; i++) if (idx[p][i] - idx[p][i - 1] < 2) seguidos.push({ p: p, i: idx[p][i] });
    });
    var pares = {};
    E.blocos.forEach(function (b) {
      var k = b.supervisores.slice().sort().join(" + ");
      pares[k] = (pares[k] || 0) + 1;
    });
    var incompletos = E.blocos.filter(function (b) {
      return b.supervisores.length !== 2 || b.supervisores[0] === b.supervisores[1];
    }).length;
    var proibidas = (E.duplas_proibidas || []);
    var blocosProibidos = E.blocos.filter(function (b) {
      return proibidas.indexOf(b.supervisores.slice().sort().join(" + ")) >= 0;
    });
    var maxPar = 0; Object.keys(pares).forEach(function (k) { if (pares[k] > maxPar) maxPar = pares[k]; });
    return {
      cont: c, gr: gr, fe: fe, idx: idx,
      spread: Math.max.apply(null, vals) - Math.min.apply(null, vals),
      spreadGr: Math.max.apply(null, grv) - Math.min.apply(null, grv),
      seguidos: seguidos, duplas: Object.keys(pares).length, maxPar: maxPar,
      incompletos: incompletos, blocosProibidos: blocosProibidos, proibidas: proibidas
    };
  }

  // ---------- cabeçalho ----------
  function htmlTopo() {
    var lg = document.getElementById("logoDark");
    return '<header class="top">' +
      (lg ? '<img class="emblema" alt="" src="' + document.getElementById("marcaAgua").getAttribute("src") + '">' : "") +
      '<div class="top-in">' +
      '<div class="brand">' +
      (lg ? '<img class="logo" alt="Grid Co." src="' + lg.getAttribute("src") + '">' : "") +
      '<span class="rule"></span><div>' +
      '<h1>Sobreaviso</h1>' +
      '<p>O&amp;M · supervisores e equipes de campo</p></div></div>' +
      '<div class="acts">' +
      '<button class="btn" id="csv">Exportar CSV</button>' +
      '<button class="btn-key" id="salvar" disabled>Salvar escala</button>' +
      '</div></div></header>';
  }

  function htmlAgora() {
    var a = indiceAgora(), b = E.blocos[a.i], prox = E.blocos[a.i + 1];
    var campoAgora = E.campo.filter(function (c) { return c.pool.length === 1; }).length;
    return '<section class="now">' +
      '<div class="live"><div class="lbl">' + (a.vivo ? "De sobreaviso agora" : "Próximo sobreaviso") + '</div>' +
      '<div class="big">' + esc(b.supervisores.join(" · ")) + '</div>' +
      '<div class="sub">' + esc(longo(b.inicio)) + (b.inicio === b.fim ? "" : " a " + esc(longo(b.fim))) + '</div></div>' +
      '<div><div class="lbl">Cobertura do bloco</div><div class="big">' + esc(b.tipo.split(" + ")[0]) + '</div>' +
      '<div class="sub">' + (b.feriado ? esc(b.tipo.split("Feriado: ")[1] || "feriado") : "semana " + b.semana) + '</div></div>' +
      (prox ? '<div><div class="lbl">Em seguida</div><div class="big">' + esc(prox.supervisores.join(" · ")) + '</div>' +
        '<div class="sub">' + esc(faixa(prox)) + '</div></div>' : "") +
      '<div><div class="lbl">Clusters sem backup</div><div class="big">' + campoAgora + ' de ' + E.campo.length + '</div>' +
      '<div class="sub">uma única pessoa cobre todos os blocos</div></div>' +
      '</section>';
  }

  function htmlAbas() {
    var pend = E.campo.filter(function (c) { return c.pool.length === 1; }).length +
      E.conflitos.filter(function (c) { return c.status !== "resolvido"; }).length;
    var t = [["mes", "Calendário", null],
      ["sup", "Escala dos supervisores", E.blocos.length],
      ["grupos", "Rodízio proposto", (E.grupos || []).length],
      ["campo", "Como está hoje", E.campo.length],
      ["usinas", "Usinas", (E.usinas || []).length],
      ["prox", "Proximidade", Object.keys(E.cobertura || {}).length],
      ["sla", "SLA por contrato", Object.keys(E.clientes || {}).length - 1],
      ["parc", "Parceiros locais", ((E.parceiros || {}).contratos || []).length],
      ["conf", "Conformidade", null],
      ["pend", "Pendências", pend]];
    return '<div class="tabs" role="tablist">' + t.map(function (x) {
      return '<button class="tab" role="tab" data-aba="' + x[0] + '" aria-selected="' + (aba === x[0]) + '">' +
        x[1] + (x[2] !== null ? '<span class="n">' + x[2] + '</span>' : "") + '</button>';
    }).join("") + '</div>';
  }

  // ---------- aba calendário ----------
  function mesesDoPeriodo() {
    var a = d(E.periodo.inicio), b = d(E.periodo.fim), out = [];
    var y = a.getFullYear(), m = a.getMonth();
    while (y < b.getFullYear() || (y === b.getFullYear() && m <= b.getMonth())) {
      out.push({ y: y, m: m, rot: MES[m] + "/" + String(y).slice(2) });
      m++; if (m > 11) { m = 0; y++; }
    }
    return out;
  }

  function blocoDoDia(iso) {
    for (var i = 0; i < E.blocos.length; i++) if (E.blocos[i].dias.indexOf(iso) >= 0) return { b: E.blocos[i], i: i };
    return null;
  }

  function iso(y, m, dia) {
    return y + "-" + ("0" + (m + 1)).slice(-2) + "-" + ("0" + dia).slice(-2);
  }

  // O cadastro guarda ou um número solto (o PESSOAL, vindo da Base de Ativos) ou o
  // par {corp, pess}. Corporativo primeiro — é a ordem de acionamento definida.
  function telLista(nome) {
    var v = ((E.contatos || {}).pessoas || {})[nome];
    if (!v) return [];
    if (typeof v === "string") return [{ t: v, tipo: "pessoal" }];
    var o = [];
    if (v.corp) o.push({ t: v.corp, tipo: "corporativo" });
    if (v.pess) o.push({ t: v.pess, tipo: v.corp ? "pessoal" : (v.sem_corp ? "pessoal · único" : "pessoal") });
    return o;
  }
  function tel(nome) {
    var ns = telLista(nome);
    if (!ns.length) return "";
    return ns.map(function (n) {
      return '<div class="tel">' + esc(n.t) +
        (ns.length > 1 || n.tipo !== "pessoal" ? ' <span class="tt">' + esc(n.tipo) + '</span>' : '') + '</div>';
    }).join("");
  }
  function telTxt(nome) {
    var ns = telLista(nome);
    return ns.length ? ns.map(function (n) { return n.t; }).join(" / ") : "";
  }
  function temContatos() { return !!((E.contatos || {}).pessoas); }

  function parceiroDoCluster(cl) {
    return ((E.contatos || {}).parceiros || {})[cl] || null;
  }

  // equipe-cluster oficial (dashboard) -> clusters do sobreaviso, supervisor e usinas
  function equipes() {
    var m = {};
    (E.usinas || []).forEach(function (u) {
      var eq = u.equipe || "— sem equipe";
      var o = m[eq] || (m[eq] = { equipe: eq, regiao: u.cluster_of || "", base: u.base || "",
                                  sups: {}, clusters: {}, usinas: [], mobilizar: 0 });
      o.sups[u.supervisor] = 1;
      o.clusters[u.cluster] = 1;
      o.usinas.push(u.usina);
      if (u.status) o.mobilizar++;
    });
    return m;
  }

  // --- filtro por colaborador -------------------------------------------------
  // Catálogo de todo mundo que aparece em alguma escala de campo, com os grupos
  // em que participa. É o que sustenta a pergunta "onde este colaborador está
  // de sobreaviso neste mês" — e a resposta quase nunca é uma UFV só.
  var _PES = null;
  function pessoas() {
    if (_PES) return _PES;
    var m = {};
    (E.grupos || []).forEach(function (g, gi) {
      (g.escala || []).forEach(function (dupla, b) {
        var lista = !dupla ? [] : (typeof dupla === "string" ? [dupla] : dupla);
        lista.forEach(function (t) {
          if (!m[t]) m[t] = { nome: t, blocos: {}, grupos: {} };
          if (!m[t].blocos[b]) m[t].blocos[b] = [];
          if (m[t].blocos[b].indexOf(gi) < 0) m[t].blocos[b].push(gi);
          m[t].grupos[gi] = true;
        });
      });
    });
    _PES = m;
    return m;
  }
  function usinasDeClusters(cls) {
    var out = [];
    (E.usinas || []).forEach(function (u) {
      if (cls.indexOf(u.cluster) >= 0 && out.indexOf(u.usina) < 0) out.push(u.usina);
    });
    return out;
  }

  function usinasDoGrupo(gi) {
    var g = (E.grupos || [])[gi];
    if (!g) return [];
    var out = [];
    (E.usinas || []).forEach(function (u) {
      if (g.clusters.indexOf(u.cluster) >= 0 && out.indexOf(u.usina) < 0) out.push(u.usina);
    });
    return out;
  }
  // grupos em que a pessoa está de sobreaviso no bloco i (vazio = não está)
  function gruposDaPessoa(nome, i) {
    var p = pessoas()[nome];
    return (p && p.blocos[i]) || [];
  }

  // quem do campo está de sobreaviso no bloco i, nos clusters de uma equipe
  function plantonistas(clusters, i) {
    var out = [];
    (E.grupos || []).forEach(function (g) {
      if (!g.clusters.some(function (c) { return clusters.indexOf(c) >= 0; })) return;
      var q = (g.escala || [])[i];
      if (!q) return;
      (typeof q === "string" ? [q] : q).forEach(function (n) {
        if (n && out.indexOf(n) < 0) out.push(n);
      });
    });
    return out;
  }

  function htmlMes() {
    var meses = mesesDoPeriodo();
    if (mesSel === null) {
      var ag = indiceAgora();
      var dAg = d(E.blocos[ag.i].inicio);
      mesSel = 0;
      for (var k = 0; k < meses.length; k++)
        if (meses[k].y === dAg.getFullYear() && meses[k].m === dAg.getMonth()) mesSel = k;
    }
    var M = meses[mesSel];
    var EQ = equipes();
    var chaves = Object.keys(EQ).sort();
    var visiveis = chaves.filter(function (k) {
      return supSel === "todos" || EQ[k].sups[supSel];
    });
    eqsSel = eqsSel.filter(function (k) { return visiveis.indexOf(k) >= 0; });
    var alvo = eqsSel.length ? eqsSel : visiveis;
    var mostrarCampo = supSel !== "todos" || eqsSel.length > 0;
    var clustersAlvo = [];
    alvo.forEach(function (k) { Object.keys(EQ[k].clusters).forEach(function (c) {
      if (clustersAlvo.indexOf(c) < 0) clustersAlvo.push(c); }); });

    var hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    var primeiro = new Date(M.y, M.m, 1);
    var offset = primeiro.getDay();
    var diasNoMes = new Date(M.y, M.m + 1, 0).getDate();
    var celulas = [];
    for (var i = 0; i < offset; i++) celulas.push('<div class="dia fora"></div>');
    for (var dia = 1; dia <= diasNoMes; dia++) {
      var s0 = iso(M.y, M.m, dia);
      var info = blocoDoDia(s0);
      var cls = "dia", dentro = "";
      if (info) {
        var b = info.b;
        cls += b.feriado ? " hol" : " on";
        var nomes = b.supervisores.map(function (p) { return '<b>' + esc(p) + '</b>' + tel(p); }).join("");
        dentro = '<div class="quem">' + nomes + '</div>';
        if (b.feriado) {
          var f = (b.tipo.split("Feriado: ")[1] || "").split(" / ")[0];
          dentro += '<div class="fer">' + esc(f) + '</div>';
        }
        if (pessoaSel !== "todos") {
          var gsP = gruposDaPessoa(pessoaSel, info.i);
          if (gsP.length) {
            var usP = [];
            gsP.forEach(function (gi) { usinasDoGrupo(gi).forEach(function (u) { if (usP.indexOf(u) < 0) usP.push(u); }); });
            dentro += '<div class="quem" style="border-top:1px solid var(--line);margin-top:5px;padding-top:4px">' +
              '<b>' + esc(pessoaSel) + '</b>' + tel(pessoaSel) +
              '<div style="font-size:11px;color:var(--ink-3);margin-top:3px">' + usP.length + ' usina(s) · ' +
              gsP.length + ' grupo(s)</div>' +
              '<div style="font-size:11.5px;line-height:1.3">' + esc(usP.join(", ")) + '</div></div>';
          } else {
            cls += " sem-pessoa";
          }
        } else if (mostrarCampo) {
          var nomesCampo = plantonistas(clustersAlvo, info.i);
          var detalhe = alvo.length <= 2;             // uma ou duas equipes: cabe telefone
          if (nomesCampo.length) dentro += '<div class="quem" style="border-top:1px solid var(--line);margin-top:5px;padding-top:4px">' +
            (detalhe
              ? nomesCampo.map(function (q) { return '<b>' + esc(q) + '</b>' + tel(q); }).join("")
              : '<span style="font-size:11px;color:var(--ink-3)">' + nomesCampo.length + ' de sobreaviso</span>' +
                '<div style="font-size:11.5px;line-height:1.3">' + esc(nomesCampo.join(", ")) + '</div>') +
            '</div>';
          var pcs = [];
          clustersAlvo.forEach(function (c) { var p = parceiroDoCluster(c); if (p && pcs.indexOf(p) < 0) pcs.push(p); });
          if (pcs.length) dentro += '<div class="quem" style="margin-top:4px">' +
            '<span style="font-size:11px;color:var(--ink-3)">apoio local</span>' +
            (detalhe
              ? pcs.map(function (p) { return '<b>' + esc(p.resp) + '</b>' + (p.tel ? '<div class="tel">' + esc(p.tel) + '</div>' : ""); }).join("")
              : '<div style="font-size:11.5px;line-height:1.3">' + esc(pcs.map(function (p) { return p.resp; }).join(", ")) + '</div>') +
            '</div>';
        }
      }

    var ctlG = '<div class="ctl">' +

      [["todos", "Todas"], ["dupla", "Com dupla (pool de 3+)"], ["unico", "Uma pessoa só"],

      // estrada) e, por último, o resto — marcado como fora do raio, porque uma troca
      // de última hora às vezes é feita mesmo assim e o painel não deve esconder isso.
      var poolN = g.pool.map(function (p) { return p.t; });
