            res.map(function (t) { return op(t, "· reserva"); }).join("") + '</optgroup>' : "") +
          (outros.length ? '<optgroup label="Fora do raio — a troca fere o SLA">' +
            outros.map(function (t) { return op(t, "⚠"); }).join("") + '</optgroup>' : "");
      }
      var quem = duo.length ? duo.map(function (n, pos) {
        var risco = poolN.indexOf(n) < 0 && alcN.indexOf(n) < 0;
        var mk = gi + ":" + iBloco + ":" + pos;
        var tm = (g.trocas_manuais || []).filter(function (x) { return x.bloco === iBloco && x.entra === n; })[0];
        return '<select class="esc-tec' + (risco ? " fora" : "") + (editados[mk] ? " dirty" : "") +
          '" data-gi="' + gi + '" data-pos="' + pos + '" title="' + (editados[mk] ? "trocado manualmente" : "escala calculada") +
          '" aria-label="Sobreaviso do grupo">' + opcoes(n) + '</select>' +
          (tm ? ' <span class="pill p-warn" title="troca determinada pela coordenação: entrou no lugar de ' + esc(tm.sai) + '">no lugar de ' + esc(tm.sai.split(" ")[0]) + '</span>' : "") +
          tel(n);
      }).join(' <span style="color:var(--ink-3)">+</span> ') : "—";
      var nAtivos = (g.ativos || g.pool.map(function (p) { return p.t; })).length;
      var nRes = (g.reservas || []).length;
      var tag = g.fora_sla ? '<span class="pill p-risk">Fora do SLA</span>'
        : nAtivos >= 2 ? '<span class="pill p-ok">' + nAtivos + ' no rodízio</span>'
        : '<span class="pill p-warn">Uma pessoa só</span>';
      if (nRes) tag += ' <span class="pill p-mute">+' + nRes + ' reserva</span>';
      var vNomes = Object.keys(g.vetados || {});
      if (vNomes.length) tag += ' ' + vNomes.map(function (t) {
        var v = g.vetados[t];
        return '<span class="pill p-warn" title="' + esc(t + ' alcança este grupo em ' +
          String(v.h).replace(".", ",") + 'h, mas está impedido de atender ' + v.clientes.join(", ")) +
          '">' + esc(t.split(" ")[0]) + ' impedido</span>';
      }).join(" ");
      var cruz = g.supervisores.length > 1
        ? ' <span class="pill p-warn" title="grupo atravessa supervisores">' + g.supervisores.map(function (s) { return s.split(" ")[0]; }).join("+") + '</span>' : "";
      if (g.atendimento_externo)
        cruz += ' <span class="pill p-warn" title="a supervisão é de um supervisor, o atendimento vem do time de outro: ' +
          esc((g.times_do_pool || []).join(", ")) + '">Atendimento de ' + esc((g.times_do_pool || ["outro time"])[0].split(" ")[0]) + '</span>';
      return '<tr' + (g.rodizio && !g.fora_sla ? "" : ' class="is-now"') + '>' +
        '<td>' + esc(g.clusters.join(" + ")) + cruz +
          '<div style="font-size:11.5px;color:var(--ink-3);line-height:1.35;margin-top:3px">' +
          usinasDeClusters(g.clusters).map(function (n) { return esc(n); }).join(" · ") + '</div></td>' +
        '<td class="num" title="' + esc(usinasDeClusters(g.clusters).join(", ")) + '">' + g.usinas + '</td>' +
        '<td class="num">' + g.sla + 'h</td>' +
        '<td><b>' + quem + '</b>' + (g.por_bloco === 2 ? ' <span class="pill p-ok" title="pool de 3 ou mais: dois de sobreaviso por bloco">dupla</span>' : "") + '</td>' +
        '<td>' + (function () {
          var cnt = {};
          (g.escala || []).forEach(function (d) { (d || []).forEach(function (t) { cnt[t] = (cnt[t] || 0) + 1; }); });
          return g.pool.map(function (p) {
          return '<span' + (p.reserva ? ' style="opacity:.62"' : '') + '>' + esc(p.t) +
            ' <span class="pill ' + (p.reserva ? 'p-mute' : 'p-ok') + '" title="' +
            (cnt[p.t] ? 'cobre ' + cnt[p.t] + ' dos ' + (g.escala || []).length + ' blocos' : 'não entra na escala regular') +
            '">' + p.h.toFixed(1) + 'h' + (cnt[p.t] ? ' · ' + cnt[p.t] + 'x' : '') + '</span>' +
            (p.reserva ? ' <span class="pill p-mute" title="não alcança o grupo em tempo comparável ao titular e nunca cobriu o cluster: fica fora do rodízio regular, disponível para férias, atestado e troca manual">reserva</span>' : '') +
            (p.obrigatorio ? ' <span class="pill p-warn" title="responsável por uma usina do grupo, indicado pela coordenação' + (p.excede ? '; excede o raio calculado' : '') + '">responsável</span>' : '') +
            '</span>';
          }).join(" · ");
        })() + '</td>' +
        '<td>' + tag + '</td></tr>';
    }).join("");
    var fora = Gtodos.filter(function (g) { return (g.incumbentes_fora || []).length; });
    return '<div class="card">' +
      '<div class="ctl">' +
      '<button class="nav" id="ant" ' + (iBloco === 0 ? "disabled" : "") + '>◀</button>' +
      '<span class="blk">' + esc(faixa(b)) + '</span>' +
      '<button class="nav" id="prox" ' + (iBloco === E.blocos.length - 1 ? "disabled" : "") + '>▶</button>' +
      '<span class="pill ' + (b.feriado ? "p-hol" : "p-mute") + '">' + esc(b.tipo) + '</span>' +
      '<span style="flex:1"></span><span class="blk">' + Gtodos.length + ' grupos · ' + comR + ' com rodízio</span></div>' +
      ctlG +
      '<div class="scroll"><table><thead><tr><th>Grupo de rodízio<br><span style="font-weight:400;font-size:12px">clusters e as usinas que eles contêm</span></th><th>Usinas</th><th title="tempo disponível para a estrada: o prazo do nível crítico menos triagem, acionamento e, onde o contrato cobra resolução, o reparo">Raio</th><th>De sobreaviso no bloco</th><th>Pool do rodízio</th><th>Situação</th></tr></thead>' +
      '<tbody>' + linhas + '</tbody></table></div>' +
      '<div class="note">Os 61 clusters viraram <b>' + Gtodos.length + ' grupos</b>: clusters vizinhos foram fundidos quando existe gente que alcança <b>todas</b> as usinas do grupo dentro do menor <b>raio</b> entre elas. ' +
      'Onde o pool tem <b>3 pessoas ou mais, dois ficam de sobreaviso por bloco</b> (marcados como <span class="pill p-ok">dupla</span>): se o primeiro acionado estiver indisponível ou já em outra usina do grupo, o SLA não depende de uma pessoa só. ' +
      'Pools de 2 mantêm um por bloco — escalar os dois seria plantão permanente para ambos. ' +
      'Quem nunca cobriu o cluster e leva mais que o dobro do tempo do titular entra como <span class="pill p-mute">reserva</span>: continua no pool para férias, atestado e troca manual, mas fica fora do rodízio regular — em Taguaí, o titular chega em 1,3h e o nome trazido de fora em 3,4h; escalar os dois não melhoraria o SLA, só esconderia que o cluster é ponto único. ' +
      'O rodízio usa no máximo 5 pessoas por grupo, priorizando quem já cobre hoje; uma fusão pode custar a saída de quem só alcançava o grupo antigo, mas nunca pode deixar o grupo com menos de 2 pessoas que cobrem tudo. ' +
      'Onde ninguém cumpre o prazo, quem atende continua sendo a equipe responsável, marcada como <b>Fora do SLA</b>. As linhas destacadas continuam com uma pessoa só — geografia não resolve, só contratação ou terceiro.</div></div>' +
      (fora.length ? '<div class="card"><div class="card-h"><h2>Quem cobre hoje mas não cumpre o SLA</h2>' +
      '<p>' + fora.length + ' grupo(s) em que o responsável atual está longe demais para o prazo do contrato.</p></div>' +
      '<div class="scroll"><table><thead><tr><th>Grupo</th><th>Quem cobre hoje e está fora do prazo</th></tr></thead><tbody>' +
      fora.map(function (g) {
        var H = g.incumbentes_fora_h || {};
        return '<tr><td>' + esc(g.clusters.join(" + ")) + '</td><td>' + g.incumbentes_fora.map(function (t) {
          var h = H[t];
          if (h === undefined) return esc(t);
          var d = Math.round((h - g.sla) * 60);
          return esc(t) + ' <span class="pill ' + (d <= 15 ? 'p-warn' : 'p-risk') + '">' +
            String(h).replace(".", ",") + 'h · ' + d + ' min além do raio de ' + g.sla + 'h</span>';
        }).join(" · ") + '</td></tr>';
      }).join("") +
      '</tbody></table></div><div class="note">Não é erro de escala: é a distância real entre a base da pessoa e a usina, comparada ao prazo assinado. ' +
      'Um estouro de poucos minutos cabe dentro do erro da própria premissa de velocidade média (70 km/h) — nesses casos, medir o trajeto real vale mais que remanejar. ' +
      'Ou muda quem cobre, ou muda a base da pessoa, ou renegocia o prazo.</div></div>' : "") +
      htmlSobrep() + htmlCompart() + htmlVetos();
  }

  // ---------- quem responde por mais de um grupo no mesmo bloco ----------
  function htmlSobrep() {
    var S = (E.sobreposicoes || []).filter(function (x) { return x.bloco === iBloco; });
    if (!S.length) return "";
    var tri = S.filter(function (x) { return x.n_grupos >= 3; }).length;
    var evit = S.filter(function (x) { return !x.unico; }).length;
    return '<div class="card"><div class="card-h"><h2>Quem responde por mais de um grupo neste bloco</h2>' +
      '<p>' + S.length + ' pessoa(s) de sobreaviso em dois ou mais grupos ao mesmo tempo' +
      (tri ? ' · <b>' + tri + ' em três ou mais</b>' : "") + '. ' +
      'Dois acionamentos simultâneos em grupos diferentes <b>não têm como ser atendidos pela mesma pessoa</b>.</p></div>' +
      '<div class="scroll"><table><thead><tr><th>Colaborador</th><th>Grupos</th><th>Usinas sob responsabilidade</th>' +
      '<th title="tempo de deslocamento entre as duas usinas mais distantes do conjunto">Extensão</th><th>Origem</th></tr></thead><tbody>' +
      S.map(function (x) {
        var risco = x.n_grupos >= 3 || x.extensao_h >= 3;
        return '<tr' + (risco ? ' class="is-now"' : '') + '>' +
          '<td><b>' + esc(x.tecnico) + '</b>' + tel(x.tecnico) + '</td>' +
          '<td>' + x.grupos.map(function (cs) { return esc(cs.join(" + ")); }).join('<br>') +
            ' <span class="pill ' + (x.n_grupos >= 3 ? "p-risk" : "p-warn") + '">' + x.n_grupos + '</span></td>' +
          '<td style="font-size:12px">' + esc(x.usinas.join(" · ")) + ' <span class="pill p-mute">' + x.usinas.length + '</span></td>' +
          '<td class="num"><span class="pill ' + (x.extensao_h >= 3 ? "p-risk" : x.extensao_h >= 2 ? "p-warn" : "p-mute") + '">' +
            String(x.extensao_h).replace(".", ",") + 'h</span></td>' +
          '<td>' + (x.unico
            ? '<span class="pill p-mute" title="todos os grupos envolvidos têm uma pessoa só: não há como redistribuir">geografia</span>'
            : '<span class="pill p-warn" title="há mais gente nos pools: parte disso é escolha de fase da escala">escala</span>') + '</td></tr>';
      }).join("") + '</tbody></table></div>' +
      '<div class="note">A <b>extensão</b> é o tempo entre as duas usinas mais distantes sob a mesma pessoa naquele bloco — é ela que diz se dois eventos simultâneos são atendíveis em sequência ou não. ' +
      'Onde a origem é <b>geografia</b>, todos os grupos envolvidos têm uma pessoa só e não há redistribuição possível: só contratação ou parceiro local. ' +
      'Onde é <b>escala</b>, o gerador já minimiza: ninguém responde por três grupos ao mesmo tempo (a única exceção é quem é sozinho em vários), ' +
      'e a escala busca <b>6 fins de semana livres por pessoa</b> onde o tamanho do pool permite. No RN são 3 pessoas para 4 vagas por bloco — o padrão possível é dois cobrindo duas cada e um de folga, girando. ' +
      (evit ? '' : 'Neste bloco, toda sobreposição é geográfica.') + '</div></div>';
  }

  // ---------- impedimentos por cliente ----------
  function htmlVetos() {
    var V = (E.vetos || {}).veto || {};
    var nomes = Object.keys(V);
    if (!nomes.length) return "";
    var sem = ((E.vetos || {}).sem_grupo) || [];
    return '<div class="card"><div class="card-h"><h2>Impedimentos por cliente</h2>' +
      '<p>' + nomes.length + ' colaborador(es) impedido(s) de atender determinados clientes. ' +
      'O plantonista responde pelo <b>grupo inteiro</b>: não dá para pular uma usina no meio do acionamento, ' +
      'então quem está impedido fica fora de qualquer grupo que contenha usina daquele cliente.</p></div>' +
      '<div class="scroll"><table><thead><tr><th>Colaborador</th><th>Impedido de atender</th><th>Situação na escala</th><th>O que sobra ao alcance</th></tr></thead><tbody>' +
      nomes.map(function (t) {
        var s = sem.filter(function (x) { return x.tecnico === t; })[0];
        var emGrupo = (E.grupos || []).filter(function (g) {
          return g.pool.some(function (p) { return p.t === t; });
        }).length;
        return '<tr' + (emGrupo ? '' : ' class="is-now"') + '><td><b>' + esc(t) + '</b></td>' +
          '<td>' + esc(V[t].join(", ")) + '</td>' +
          '<td>' + (emGrupo
            ? '<span class="pill p-ok">' + emGrupo + ' grupo(s)</span>'
            : '<span class="pill p-risk">Fora de qualquer rodízio</span>') + '</td>' +
          '<td>' + (s && s.alcanca_sem_veto.length
            ? s.alcanca_sem_veto.map(function (a) {
                return esc(a.cluster) + ' <span class="pill p-mute">' + String(a.h).replace(".", ",") + 'h</span>';
              }).join(" · ")
            : '<span style="color:var(--ink-3)">nenhum cluster sem o cliente impedido dentro do raio</span>') + '</td></tr>';
      }).join("") + '</tbody></table></div>' +
      '<div class="note">Um impedimento de cliente não é o mesmo que distância: ele não some com deslocamento nem com contratação. ' +
      'Quando o único cluster ao alcance está fundido a usinas do cliente impedido, a pessoa fica sem sobreaviso — ' +
      'separar aquele cluster do grupo é a única saída, e é decisão de gestão, não de cálculo. ' +
      '<b>Decisão da coordenação em 03/09: não separar Elias Fausto por ora</b> — Bruno Pupo permanece fora do sobreaviso no quadrimestre. ' +
      'Nenhuma usina fica descoberta por isso; o grupo mantém as mesmas 5 pessoas no rodízio ativo.</div></div>';
  }

  // ---------- grupos distintos que dividem as mesmas pessoas ----------
  // A pergunta é "se é a mesma gente atendendo, por que são dois grupos?".
  // Nem sempre a resposta é que deveriam ser um só — e aqui fica registrado o motivo.
  function htmlCompart() {
    var C = E.compartilhados || [];
    if (!C.length) return "";
    var TAG = {
      fundivel: '<span class="pill p-ok">Pode fundir</span>',
      cobertura: '<span class="pill p-warn">Fusão pioraria</span>',
      incumbente: '<span class="pill p-warn">Expulsaria quem cobre</span>',
      usinas: '<span class="pill p-mute">Passa do teto de usinas</span>'
    };
    var podem = C.filter(function (x) { return x.motivo === "fundivel"; }).length;
    return '<div class="card"><div class="card-h"><h2>Grupos diferentes que dividem as mesmas pessoas</h2>' +
      '<p>' + C.length + ' par(es) de grupos com gente em comum no pool' +
      (podem ? ' · <b>' + podem + ' ainda pode(m) ser fundido(s)</b>' : ' · nenhum deles pode ser fundido sem perder cobertura') +
      '.</p></div>' +
      '<div class="scroll"><table><thead><tr><th>Grupo A</th><th>Grupo B</th><th>Em comum</th><th>Por que continuam separados</th></tr></thead><tbody>' +
      C.map(function (x) {
        return '<tr' + (x.motivo === "fundivel" ? ' class="is-now"' : '') + '>' +
          '<td>' + esc(x.a.join(" + ")) + '</td>' +
          '<td>' + esc(x.b.join(" + ")) + '</td>' +
          '<td>' + esc(x.comum.join(", ")) + '</td>' +
          '<td>' + (TAG[x.motivo] || "") + ' ' + esc(x.detalhe) + '</td></tr>';
      }).join("") + '</tbody></table></div>' +
      '<div class="note">Duas pessoas no mesmo pool de dois grupos não significa que os grupos deveriam ser um só. ' +
      'A fusão só vale se <b>pelo menos 2 pessoas alcançam todas as usinas do conjunto</b> dentro do raio. ' +
      'Quando só uma alcança, fundir transforma dois grupos com rodízio em <b>um grupo de pessoa única</b> — troca ruim. ' +
      'É o caso de <b>Fernandópolis / Aparecida do Taboado</b> com <b>Altair + Tanabi + Barretos</b>: Paulo Sergio cobre os dois, ' +
      'mas é o único que alcança as duas pontas; fundir tiraria Anderson Luiz e Eduardo Souza do rodízio. ' +
      'O que resolve Fernandópolis não é agrupar — é o segundo nome que hoje não existe ali.</div></div>';
  }

  // ---------- aba proximidade ----------
  function htmlProx() {
    var C = E.cobertura || {};
    var linhas = E.campo.map(function (c) {
      var v = C[c.cluster];
      if (!v) return '<tr><td>' + esc(c.cluster) + '</td><td colspan="5" class="num">sem coordenada de município</td></tr>';
      var extras = v.candidatos.filter(function (x) { return c.pool.indexOf(x.t) < 0; });
      var tag = !c.ponto_unico ? '<span class="pill p-ok">Rodízio</span>'
        : extras.length ? '<span class="pill p-warn">Vizinho disponível</span>'
        : '<span class="pill p-risk">Isolado</span>';
      return '<tr' + (c.ponto_unico && !extras.length ? ' class="is-now"' : "") + '>' +
        '<td>' + esc(c.cluster) + '</td>' +
        '<td class="num">' + v.sla + 'h</td>' +
        '<td class="num">' + v.usinas + '</td>' +
        '<td>' + esc(c.pool.join(" · ")) + '</td>' +
        '<td>' + (extras.length
          ? extras.slice(0, 4).map(function (x) { return esc(x.t) + ' <span class="pill p-mute">' + x.h.toFixed(1) + 'h</span>'; }).join(" · ")
          : '<span style="color:var(--ink-3)">ninguém do quadro alcança dentro do SLA</span>') + '</td>' +
        '<td>' + tag + '</td></tr>';
    }).join("");
    var iso = E.campo.filter(function (c) { return c.ponto_unico && !(C[c.cluster] && C[c.cluster].candidatos.filter(function (x) { return c.pool.indexOf(x.t) < 0; }).length); }).length;
    return '<div class="card"><div class="card-h"><h2>Quem alcança cada cluster dentro do SLA</h2>' +
      '<p>Distância em linha reta entre a cidade-base do técnico e a usina mais distante do cluster, × 1,30 de fator rodoviário, a 70 km/h. ' +
      'A posição da usina vem da <b>coordenada real</b> do Dashboard O&amp;M em 106 das 119 usinas; nas outras 13, da sede do município.</p></div>' +
      '<div class="scroll"><table><thead><tr><th>Cluster</th><th title="tempo disponível para a estrada">Raio</th><th>Usinas</th><th>Pool atual</th><th>Quem mais alcança</th><th>Situação</th></tr></thead>' +
      '<tbody>' + linhas + '</tbody></table></div>' +
      '<div class="note">O tempo é <b>estimativa</b>: linha reta corrigida por fator de estrada, não roteirização real — mas a partir da coordenada da usina, não mais do centro da cidade. Serve para separar o que é possível do que é impossível, não para prometer prazo ao cliente. ' +
      '<b>' + iso + ' clusters continuam isolados</b> — nenhum técnico do quadro alcança dentro do prazo do contrato, e nesses a saída é contratar, treinar um segundo ou fechar terceiro de plantão.</div></div>';
  }

  // ---------- aba SLA ----------
  function htmlSla() {
    var cont = {};
    E.campo.forEach(function (c) {
      (c.clientes || [c.cliente]).forEach(function (k) { cont[k] = (cont[k] || 0) + 1; });
    });
    var nomes = Object.keys(E.clientes).filter(function (k) { return k !== "?"; });
    nomes.sort(function (a, b) {
      var sa = E.clientes[a].sla_h || 99, sb = E.clientes[b].sla_h || 99;
      return sa - sb || a.localeCompare(b);
    });
    var RT = E.relogio_txt || {};
    var PR = E.premissas_sla || { t_prep: 0.5, t_obra: 1.5 };
    var linhas = nomes.map(function (k) {
      var c = E.clientes[k];
      var pill = c.sla_h
        ? '<span class="pill ' + (c.sla_h <= 2 ? "p-risk" : c.sla_h <= 4 ? "p-warn" : "p-ok") + '">' + c.sla_h + ' horas</span>'
        : '<span class="pill p-mute">sem número no contrato</span>';
      var dp = c.desloc_h
        ? '<span class="pill ' + (c.desloc_h <= 2 ? "p-risk" : c.desloc_h <= 3.5 ? "p-warn" : "p-ok") + '">' + String(c.desloc_h).replace(".", ",") + ' h de estrada</span>'
        : '<span class="pill p-mute">—</span>';
      var tab = (c.niveis || []).map(function (n, ix) {
        return '<tr' + (n[0] === c.nivel_sobreaviso ? ' style="background:rgba(169,219,33,.10)"' : '') + '>' +
          '<td style="white-space:nowrap"><b>' + esc(n[0]) + '</b>' +
          (n[0] === c.nivel_sobreaviso ? ' <span class="pill p-ok" title="é este nível que o sobreaviso de fim de semana atende">sobreaviso</span>' : '') +
          '</td><td>' + esc(n[1]) + '</td><td class="num" style="white-space:nowrap">' + esc(n[3]) + '</td></tr>';
      }).join("");
      return '<tr><td><b>' + esc(k) + '</b><div style="font-size:12px;color:var(--ink-3);margin-top:2px">' + (cont[k] || 0) + ' cluster(s)</div></td>' +
        '<td>' + pill + '<div style="margin-top:4px">' + dp + '</div>' +
        '<div style="font-size:12px;color:var(--ink-3);margin-top:3px">o relógio ' + esc(RT[c.relogio] || c.relogio) + '</div></td>' +
        '<td style="max-width:520px">' +
          '<table style="width:100%;font-size:12px;margin:0 0 6px"><thead><tr><th>Nível</th><th>Gatilho</th><th>Prazo</th></tr></thead><tbody>' + tab + '</tbody></table>' +
          esc(c.texto) + '<br><span style="font-size:12px;color:var(--ink-3)"><i>' + esc(c.fonte) + '</i></span></td></tr>';
    }).join("");
    var mistos = E.campo.filter(function (c) { return c.misto; });
    var semCli = E.campo.filter(function (c) { return c.cliente === "?"; });
    var duvidas = E.campo.filter(function (c) {
      return !c.misto && c.sla_obs && (c.sla_obs.indexOf("confirmar") >= 0 || c.sla_obs.indexOf("MESMA") >= 0);
    });
    return '<div class="card"><div class="card-h"><h2>Criticidade e SLA por contrato</h2>' +
      '<p>Todo contrato tem tabela de criticidade. O sobreaviso de fim de semana atende a <b>linha destacada</b>; ' +
      'os níveis abaixo dela têm prazo de 24h a 15 dias e entram na fila do dia útil seguinte.</p></div>' +
      '<div class="scroll"><table><thead><tr><th>Cliente</th><th>Prazo do nível crítico<br><span style="font-weight:400;font-size:12px">e o que sobra para dirigir</span></th><th>Tabela de criticidade do contrato</th></tr></thead>' +
      '<tbody>' + linhas + '</tbody></table></div>' +
      '<div class="note"><b>O prazo contratual não é tempo de viagem.</b> Cada contrato para o cronômetro em um ponto diferente: ' +
      'a <b>SEMP</b> conta <b>chegada na usina</b> (2h, o mais duro do portfólio); a <b>Greenyellow</b> conta <b>resolução</b> ' +
      '(resposta 2h atendível remotamente pelo COS, mas resolução em 4h); <b>Thopen, 2C, Ultragaz e RenoGrid</b> contam ' +
      '<b>atendimento</b> e aceitam acionamento remoto como meio de intervenção; <b>GD Energy</b> e <b>Alves Lima</b> contam até a ' +
      '<b>mobilização</b>, não até a chegada; e a <b>Athon</b> empurra formalmente a ocorrência fora de 06h-18h para a manhã seguinte. ' +
      'O raio usado no agrupamento é o prazo crítico menos ' + String(PR.t_prep).replace(".", ",") + 'h de triagem e acionamento ' +
      '(e menos ' + String(PR.t_obra).replace(".", ",") + 'h de reparo em campo onde o relógio só para na resolução). ' +
      'Esses dois descontos são <b>premissa operacional, não cláusula</b> — se a coordenação medir outro número, o raio inteiro se move.</div></div>' +
      '<div class="card"><div class="card-h"><h2>Clusters que precisam de decisão</h2>' +
      '<p>' + mistos.length + ' cluster(s) misturam contratos de clientes diferentes' +
      (duvidas.length ? ' · ' + duvidas.length + ' com nome a corrigir' : '') +
      (semCli.length ? ' · ' + semCli.length + ' sem contrato' : '') + '.</p></div>' +
      '<div class="scroll"><table><thead><tr><th>Cluster</th><th>Supervisor</th><th>SLA que vale</th><th>Situação</th></tr></thead><tbody>' +
      mistos.concat(semCli, duvidas).map(function (c) {
        var tag = c.cliente === "?" ? '<span class="pill p-risk">Sem contrato</span>'
          : c.misto ? '<span class="pill p-warn">Contratos misturados</span>'
          : '<span class="pill p-mute">Nome do cluster</span>';
        return '<tr><td>' + esc(c.cluster) + '</td><td class="num">' + esc(c.supervisor.split(" ")[0]) + '</td>' +
          '<td class="num">' + (c.sla_h ? c.sla_h + "h" : "—") + (c.desloc_h ? '<div style="font-size:12px;color:var(--ink-3)">' + String(c.desloc_h).replace(".", ",") + 'h de estrada</div>' : "") + '</td>' +
          '<td>' + tag + ' ' + esc((c.sla_obs || "").replace("MISTO: ", "")) + '</td></tr>';
      }).join("") + '</tbody></table></div>' +
      '<div class="note">Num cluster misto vale o <b>SLA mais curto</b>: o técnico de sobreaviso responde por todas as usinas do cluster, ' +
      'então o prazo do contrato mais apertado governa o cluster inteiro. <b>Demerval Lobão / Timon / Junco</b> e <b>Macaíba / Senador Elói</b> ' +
      'caem para 2h por causa da Greenyellow — separar essas usinas ou renegociar o prazo são as duas saídas.</div></div>';
  }

  // ---------- aba parceiros locais ----------
  function htmlParc() {
    var P = E.parceiros || { contratos: [], sem_contrato: [] };
    var ct = P.contratos || [], sc = P.sem_contrato || [];
    var semc = ct.filter(function (c) { return c.sit === "sem_contrato" || c.sit === "vencido"; }).length;
    var adit = ct.filter(function (c) { return c.sit === "aditivacao"; }).length;
    var durante = ct.filter(function (c) { return c.sit === "vence durante a escala"; }).length;
    var ok = ct.length - semc - adit - durante;

    var linhas = ct.map(function (c) {
      var pill = (c.sit === "sem_contrato" || c.sit === "vencido") ? '<span class="pill p-risk">' + esc(c.rotulo || "Sem contrato") + '</span>'
        : c.sit === "aditivacao" ? '<span class="pill p-warn">Em aditivação</span>'
        : c.sit === "vence durante a escala" ? '<span class="pill p-warn">Vence na escala</span>'
        : '<span class="pill p-ok">Vigente</span>';
      var grupo = (E.grupos || []).filter(function (g) { return g.clusters.indexOf(c.cluster) >= 0; })[0];
      var apoio = grupo
        ? (grupo.pool.length < 2 ? '<span class="pill p-warn">apoia ponto único</span>' : grupo.pool.length + ' no rodízio')
        : '<span class="pill p-mute">cluster não encontrado</span>';
      var pc0 = ((E.contatos || {}).parceiros_por_local || {})[c.local];
      var tl = pc0 ? pc0.tel : "";
      return '<tr><td><b>' + esc(c.local) + '</b><br><span style="font-size:12px;color:var(--ink-3)">' + esc(c.prestador) + '</span></td>' +
        '<td>' + esc(c.resp) + (tl ? '<div class="tel">' + esc(tl) + '</div>' : "") + '</td>' +
        '<td class="num">' + esc(c.prazo_h) + 'h</td>' +
        '<td class="num">' + esc(c.assinado) + '</td>' +
        '<td class="num">' + esc(c.vence) + '</td>' +
        '<td>' + pill + '</td>' +
        '<td>' + esc(c.cluster) + '<br><span style="font-size:12px;color:var(--ink-3)">' + apoio + '</span></td>' +
        '<td style="max-width:340px;font-size:13px">' + esc(c.escopo) + '<br><span style="font-size:12px;color:var(--ink-3)"><i>' + esc(c.obs) + '</i></span></td></tr>';
    }).join("");

    var linhasSC = sc.map(function (c) {
      var pc1 = ((E.contatos || {}).parceiros || {})[c.cluster];
      var tl2 = pc1 ? pc1.tel : "";
      return '<tr><td><b>' + esc(c.local) + '</b></td><td>' + esc(c.resp) + (tl2 ? '<div class="tel">' + esc(tl2) + '</div>' : "") + '</td>' +
        '<td>' + (c.status === "Ativo" ? '<span class="pill p-ok">Ativo</span>' : '<span class="pill p-mute">' + esc(c.status) + '</span>') + '</td>' +
        '<td>' + esc(c.cluster) + '</td></tr>';
    }).join("");

    return '<div class="card"><div class="card-h"><h2>Colaboradores locais — contratos assinados</h2>' +
      '<p>Camada de <b>primeiro atendimento</b>: religamento, reinicialização e inspeção. <b>Não substitui</b> o técnico Grid de sobreaviso — ' +
      'os grupos de rodízio seguem exigindo plantonista próprio.</p></div>' +
      '<div class="kpis">' +
      '<div class="kpi"><div class="lbl">Sem contrato</div><div class="v"' + (semc ? ' style="color:var(--risk)"' : '') + '>' + semc + '</div>' +
      '<div class="d">sem renovação prevista</div></div>' +
      '<div class="kpi"><div class="lbl">Em aditivação</div><div class="v"' + (adit ? ' style="color:var(--warn)"' : '') + '>' + adit + '</div>' +
      '<div class="d">aditivo em curso</div></div>' +
      '<div class="kpi"><div class="lbl">Vencem na escala</div><div class="v"' + (durante ? ' style="color:var(--warn)"' : '') + '>' + durante + '</div>' +
      '<div class="d">entre set e dez/2026</div></div>' +
      '<div class="kpi"><div class="lbl">Cobrem o período</div><div class="v">' + ok + '</div><div class="d">de ' + ct.length + ' contratos</div></div>' +
      '<div class="kpi"><div class="lbl">Sem contrato arquivado</div><div class="v">' + sc.length + '</div><div class="d">localidades no controle</div></div>' +
      '</div>' +
      '<div class="scroll"><table><thead><tr><th>Localidade / prestador</th><th>Responsável</th><th>Prazo</th>' +
      '<th>Assinado</th><th>Vence</th><th>Situação</th><th>Cluster Grid</th><th>Escopo e observações</th></tr></thead>' +
      '<tbody>' + linhas + '</tbody></table></div>' +
      '<div class="note">Vencimento = data de assinatura + prazo do <b>item 5.1</b> de cada contrato; a situação vem da coordenação de O&amp;M e prevalece sobre a data. ' +
      '<b>Colíder</b> e <b>Poconé</b> estão em aditivação — venceram porque foram assinados com prazo de apenas 2 meses, e no caso de Poconé o novo contrato passa a ser ' +
      'remunerado <b>por acionamento</b>. <b>Ponto Belo</b> e <b>Marialva I</b> seguem sem contrato: nos dois casos o grupo tem rodízio próprio, ' +
      'então a usina não fica descoberta — o que se perde é o primeiro atendimento local e o prazo exigível do parceiro. ' +
      'Enquanto o aditivo de <b>Colíder</b> não sai, o único ponto isolado com apoio local contratado está sem cobertura formal.</div>' +
      (function () {
        var P = (E.contatos || {}).parceiros || {}, ruins = [];
        Object.keys(P).forEach(function (k) { if (P[k].completo === false) ruins.push(P[k].resp); });
        return ruins.length ? '<div class="note"><b>' + ruins.length + ' contato(s) de parceiro com 8 dígitos</b> no controle (' +
          esc(ruins.join(", ")) + '): números de celular no Brasil têm 9 dígitos, então esses não completam chamada como estão. ' +
          'Conferir antes de contar com eles num acionamento.</div>' : "";
      })() +
      '<div class="note">Dois pontos de atenção no texto dos contratos: <b>Matões</b> se contradiz — o item 3.1 diz "somente em dias úteis" ' +
      'e o item 3.3 diz "somente em dias não úteis (sábado, domingo e feriados)"; e <b>Coração 1 e 2</b> cobre apenas as duas usinas de Joaçaba — ' +
      '<b>Guatambu</b>, no mesmo cluster, está fora do objeto. Telefones dos parceiros ficam fora deste painel por serem dado pessoal.</div></div>' +
      '<div class="card"><div class="card-h"><h2>Localidades sem contrato arquivado</h2>' +
      '<p>Aparecem no controle de colaboradores locais, mas não há contrato na pasta <i>01. Contratos</i>.</p></div>' +
      '<div class="scroll"><table><thead><tr><th>Localidade</th><th>Responsável</th><th>Status no controle</th><th>Cluster Grid</th></tr></thead>' +
      '<tbody>' + linhasSC + '</tbody></table></div>' +
      '<div class="note"><b>Sete Lagoas</b> e <b>Nova Xavantina</b> são clusters hoje dependentes de uma pessoa só. ' +
      'Se o parceiro estiver de fato operando, é a diferença entre risco alto e risco administrado — mas hoje é acordo sem contrato.</div></div>';
  }

  // ---------- aba conformidade ----------
  function htmlConf() {
    var v = conformidade();
    var maxc = Math.max.apply(null, E.supervisores.map(function (p) { return v.cont[p]; }));
    var linhas = E.supervisores.map(function (p) {
      var g = v.idx[p], gaps = [];
      for (var i = 1; i < g.length; i++) gaps.push(g[i] - g[i - 1]);
      var min = gaps.length ? Math.min.apply(null, gaps) : "—";
      return '<tr><td>' + esc(p) + '</td>' +
        '<td class="num">' + v.cont[p] + '</td>' +
        '<td><div class="bar"><i style="width:' + Math.round(v.cont[p] / maxc * 100) + '%"></i></div></td>' +
        '<td class="num">' + v.fe[p] + '</td><td class="num">' + v.gr[p] + '</td>' +
        '<td class="num">' + min + '</td>' +
        '<td>' + (min !== "—" && min < 2 ? '<span class="pill p-risk">Blocos seguidos</span>' : '<span class="pill p-ok">OK</span>') + '</td></tr>';
    }).join("");
    var regras = [
      ["Todo bloco com 2 supervisores distintos", v.incompletos === 0, v.incompletos === 0 ? "18 de 18 blocos" : v.incompletos + " bloco(s) com falha"],
      ["Ninguém em blocos consecutivos", v.seguidos.length === 0, v.seguidos.length === 0 ? "folga mínima de 1 bloco cheio" : v.seguidos.length + " ocorrência(s)"],
      ["Carga equilibrada no período", v.spread <= 1, "diferença de " + v.spread + " escala(s) entre o maior e o menor"],
      ["Feriados longos distribuídos", v.spreadGr <= 1, "diferença de " + v.spreadGr + " feriado(s) longo(s)"],
      ["Duplas rotativas", v.maxPar <= 3, v.duplas + " duplas distintas · máx. " + v.maxPar + "x a mesma"]
    ];
    if (v.proibidas.length) {
      regras.push(["Duplas vetadas fora da escala (" + v.proibidas.join("; ") + ")",
        v.blocosProibidos.length === 0,
        v.blocosProibidos.length === 0 ? "nenhum bloco com a dupla vetada"
          : v.blocosProibidos.length + " bloco(s): " + v.blocosProibidos.map(function (b) { return faixa(b); }).join(", ")]);
    }
    return '<div class="card"><div class="card-h"><h2>Carga por supervisor</h2><p>Período de ' +
      curto(E.periodo.inicio) + " a " + curto(E.periodo.fim) + ' · ' + E.blocos.length + ' blocos de cobertura.</p></div>' +
      '<div class="scroll"><table><thead><tr><th>Supervisor</th><th>Escalas</th><th></th><th>Feriados</th><th>Feriados longos</th><th>Folga mín. (blocos)</th><th>Status</th></tr></thead>' +
      '<tbody>' + linhas + '</tbody></table></div></div>' +
      '<div class="card"><div class="card-h"><h2>Regras da escala</h2><p>Recalculadas a cada edição.</p></div>' +
      '<div class="scroll"><table><thead><tr><th>Regra</th><th>Situação</th><th>Medida</th></tr></thead><tbody>' +
      regras.map(function (r) {
        return '<tr><td>' + r[0] + '</td><td>' + (r[1] ? '<span class="pill p-ok">Atende</span>' : '<span class="pill p-risk">Não atende</span>') +
          '</td><td class="num">' + esc(r[2]) + '</td></tr>';
      }).join("") + '</tbody></table></div></div>';
  }

  // ---------- aba pendências ----------
  function htmlPend() {
    var unicos = E.campo.filter(function (c) { return c.pool.length === 1; });
    var porSup = {};
    unicos.forEach(function (c) { (porSup[c.supervisor] = porSup[c.supervisor] || []).push(c); });
    var confl = E.conflitos.map(function (c) {
      var cls = c.status === "resolvido" ? "p-ok" : c.status === "confirmar" ? "p-warn" : "p-risk";
      var txt = c.status === "resolvido" ? "Resolvido" : c.status === "confirmar" ? "Confirmar" : "Em aberto";
      return '<tr><td>' + esc(c.cluster) + '</td><td class="num">' + esc(c.abas) + '</td><td>' + esc(c.decisao) + '</td>' +
        '<td><span class="pill ' + cls + '">' + txt + '</span></td></tr>';
    }).join("");
    var un = Object.keys(porSup).map(function (s) {
      return '<tr><td>' + esc(s === "Sem supervisor" ? "— sem supervisor —" : s) + '</td>' +
        '<td class="num">' + porSup[s].length + '</td>' +
        '<td>' + porSup[s].map(function (c) { return esc(c.cluster) + " <span class=\"pill p-mute\">" + esc(c.pool[0]) + "</span>"; }).join(" · ") + '</td></tr>';
    }).join("");
    return '<div class="card"><div class="card-h"><h2>Clusters sem backup de sobreaviso</h2>' +
      '<p>' + unicos.length + ' de ' + E.campo.length + ' clusters dependem de uma só pessoa ou dupla fixa em todos os blocos.</p></div>' +
      '<div class="scroll"><table><thead><tr><th>Supervisor</th><th>Clusters</th><th>Quem cobre hoje</th></tr></thead><tbody>' + un + '</tbody></table></div>' +
      '<div class="note">Ação sugerida: para cada cluster desta lista, nomear um segundo responsável treinado. ' +
      'Enquanto isso não existir, o painel continuará marcando o cluster como <b>ponto único</b>.</div></div>' +
      '<div class="card"><div class="card-h"><h2>Clusters com dono duplicado ou indefinido</h2>' +
      '<p>' + (function () {
        var ab = E.conflitos.filter(function (c) { return c.status === "aberto"; }).length;
        var cf = E.conflitos.filter(function (c) { return c.status === "confirmar"; }).length;
        return (ab ? '<b>' + ab + ' em aberto</b>' : 'Nenhuma pendência de dono em aberto') +
          (cf ? ' · ' + cf + ' a confirmar' : "") + '. Divergências encontradas entre as abas da planilha original.';
      })() + '</p></div>' +
      '<div class="scroll"><table><thead><tr><th>Cluster</th><th>Onde aparecia</th><th>Decisão adotada</th><th>Status</th></tr></thead><tbody>' + confl + '</tbody></table></div>' +
      '<div class="note">A carteira de cada supervisor decorre destas decisões. Hoje: ' +
      (function () {
        var m = {};
        E.campo.forEach(function (c) { m[c.supervisor] = (m[c.supervisor] || 0) + 1; });
        var u = {};
        (E.usinas || []).forEach(function (x) { u[x.supervisor] = (u[x.supervisor] || 0) + 1; });
        return Object.keys(m).sort(function (a, b) { return m[b] - m[a]; }).map(function (s) {
          return '<b>' + esc(s.split(" ")[0]) + '</b> ' + m[s] + ' cluster(s) / ' + (u[s] || 0) + ' usina(s)';
        }).join(" · ");
      })() + '.</div></div>' + htmlRotulos();
  }

  // ---------- rótulo do cluster x usinas que ele contém ----------
  // O nome do cluster veio da planilha e nunca acompanhou as inclusões: uma usina
  // fora do rótulo some da leitura, porque a aba de rodízio mostrava só o nome.
  function htmlRotulos() {
    var R = E.rotulos || [];
    var linhas = (E.campo || []).map(function (c) {
      var us = usinasDeClusters([c.cluster]);
      var partes = c.cluster.split(" / ").length;
      var div = R.filter(function (x) { return x.cluster === c.cluster; })[0];
      return { cluster: c.cluster, us: us, partes: partes, div: div };
    });
    var ruins = linhas.filter(function (x) { return x.div; });
    var abrev = linhas.filter(function (x) { return !x.div && x.us.length !== x.partes; });
    return '<div class="card"><div class="card-h"><h2>Rótulo do cluster × usinas que ele contém</h2>' +
      '<p>' + (ruins.length
        ? '<b>' + ruins.length + ' cluster(s) com usina fora do rótulo.</b>'
        : 'Nenhum cluster tem usina fora do rótulo.') +
      (abrev.length ? ' ' + abrev.length + ' usam nome abreviado ou agrupado (ex.: <i>Ibaté I e II</i> para duas usinas) — isso é aceitável.' : "") +
      '</p></div>' +
      (ruins.length ? '<div class="scroll"><table><thead><tr><th>Cluster</th><th>Usina fora do rótulo</th><th>Rótulo sem usina</th><th>Rótulo que descreveria o cluster</th></tr></thead><tbody>' +
        ruins.map(function (x) {
          return '<tr class="is-now"><td>' + esc(x.cluster) + '</td>' +
            '<td>' + esc((x.div.ocultas || []).join(", ") || "—") + '</td>' +
            '<td>' + esc((x.div.fantasmas || []).join(", ") || "—") + '</td>' +
            '<td>' + esc(x.div.sugestao || "") + '</td></tr>';
        }).join("") + '</tbody></table></div>' : "") +
      '<div class="scroll"><table><thead><tr><th>Cluster</th><th>Partes no rótulo</th><th>Usinas</th><th>Usinas que ele contém</th></tr></thead><tbody>' +
      linhas.filter(function (x) { return x.div || x.us.length !== x.partes; }).map(function (x) {
        return '<tr><td>' + esc(x.cluster) + '</td><td class="num">' + x.partes + '</td>' +
          '<td class="num">' + x.us.length + '</td><td>' + esc(x.us.join(" · ")) + '</td></tr>';
      }).join("") + '</tbody></table></div>' +
      '<div class="note">A varredura compara cada nome do rótulo com as usinas do cluster, tratando código do dashboard, ' +
      'numeral romano e abreviação como o mesmo nome (<i>MTS100 (Matões 100)</i> = <i>Matões 100</i>; <i>Sapucaia</i> = <i>Córrego do Sapucaia</i>). ' +
      'Só entra na lista de cima quem tem usina que o rótulo não menciona de forma alguma — o caso que fazia a usina desaparecer da leitura. ' +
      'A tabela de baixo mostra os clusters em que a contagem de partes do nome difere do número de usinas: quase sempre é abreviação legítima.</div></div>';
  }

  // ---------- montagem ----------
  function render() {
    var corpo = aba === "mes" ? htmlMes() : aba === "sup" ? htmlSup() : aba === "campo" ? htmlCampo()
      : aba === "grupos" ? htmlGrupos() : aba === "usinas" ? htmlUsinas() : aba === "prox" ? htmlProx() : aba === "sla" ? htmlSla()
      : aba === "parc" ? htmlParc() : aba === "conf" ? htmlConf() : htmlPend();
    app.innerHTML = htmlTopo() + '<div class="wrap">' + htmlAgora() + htmlAbas() + corpo +
      '<div class="foot">Escala gerada em ' + esc(E.meta.gerado) + ' a partir da planilha <i>SOBREAVISOS EQUIPES GRID.xlsx</i>. ' +
      'Esta página é o controle vigente: as edições feitas aqui viram a nova versão ao salvar.</div></div>';
    var bs = document.getElementById("salvar");
    bs.disabled = !dirty;
    bs.textContent = pub ? "Salvar escala" : "Baixar escala atualizada";
    bs.title = pub ? "Publica uma nova versão desta página com as edições"
      : "Esta cópia é um arquivo local: salvar baixa o HTML já com as edições, para substituir o arquivo da pasta";
    ligar();
  }

  function marcarSujo() {
    dirty = true;
    var b = document.getElementById("salvar");
    if (b) b.disabled = false;
  }

  function ligar() {
    Array.prototype.forEach.call(app.querySelectorAll(".tab"), function (t) {
      t.onclick = function () { aba = t.dataset.aba; render(); };
    });
    Array.prototype.forEach.call(app.querySelectorAll("select[data-blk]"), function (s) {
      s.onchange = function () {
        E.blocos[+s.dataset.blk].supervisores[+s.dataset.pos] = s.value;
        s.classList.add("dirty"); marcarSujo();
        if (aba === "sup") { var y = window.scrollY; render(); window.scrollTo(0, y); }
      };
    });
    var gs1 = document.getElementById("gSup"), gs2 = document.getElementById("gPes"),
        gs3 = document.getElementById("gSit"), gs4 = document.getElementById("gTxt"),
        gs5 = document.getElementById("gLimpar");
    if (gs1) gs1.onchange = function () { gSup = gs1.value; render(); };
    if (gs2) gs2.onchange = function () { gPes = gs2.value; render(); };
    if (gs3) gs3.onchange = function () { gSit = gs3.value; render(); };

  function longo(s) { var x = d(s); return DIA[x.getDay()] + " " + x.getDate() + " " + MES[x.getMonth()]; }
  function faixa(b) { return b.inicio === b.fim ? curto(b.inicio) : curto(b.inicio) + " a " + curto(b.fim); }

  function indiceAgora() {
    var hoje = new Date(); hoje.setHours(0, 0, 0, 0);

      if (hoje >= d(b.inicio) && hoje <= d(b.fim)) return { i: i, vivo: true };
    }
    for (var j = 0; j < E.blocos.length; j++) if (d(E.blocos[j].inicio) > hoje) return { i: j, vivo: false };
    return { i: E.blocos.length - 1, vivo: false };
  }

  // ---------- conformidade ----------
  function conformidade() {
    var c = {}, gr = {}, fe = {}, i, k;
    E.supervisores.forEach(function (p) { c[p] = 0; gr[p] = 0; fe[p] = 0; });
    var idx = {}; E.supervisores.forEach(function (p) { idx[p] = []; });
    E.blocos.forEach(function (b, i) {
      b.supervisores.forEach(function (p) {
        if (c[p] === undefined) { c[p] = 0; gr[p] = 0; fe[p] = 0; idx[p] = []; }
        c[p]++; idx[p].push(i);
        if (b.peso === "grande") gr[p]++;
        if (b.feriado) fe[p]++;
      });
    });
    var vals = Object.keys(c).map(function (k) { return c[k]; });
    var grv = Object.keys(gr).map(function (k) { return gr[k]; });
    var seguidos = [];
    Object.keys(idx).forEach(function (p) {
      for (var i = 1; i < idx[p].length; i++) if (idx[p][i] - idx[p][i - 1] < 2) seguidos.push({ p: p, i: idx[p][i] });
    });
    var pares = {};
    E.blocos.forEach(function (b) {
      var k = b.supervisores.slice().sort().join(" + ");
      pares[k] = (pares[k] || 0) + 1;

    var incompletos = E.blocos.filter(function (b) {
      return b.supervisores.length !== 2 || b.supervisores[0] === b.supervisores[1];
